name: Acquisitie 2.0A.3 regressiefix

on:
  push:
    branches:
      - feat/acquisitie-workflow-2-0a3-polymorfe-selectie
    paths:
      - '.github/workflows/acquisitie-2a3-regressiefix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/acquisitie-workflow-2-0a3-polymorfe-selectie
          fetch-depth: 0
      - name: Render Vastgoedkansen only when present
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/offmarket/acquisitie/AcquisitieSelectieTab.tsx')
          s = p.read_text()
          old = '      <VastgoedkansenInAcquisitieSelectie items={items} />\n      <AcquisitieKpis kpis={readiness.kpis} />'
          new = '      {heeftVastgoedkansen && <VastgoedkansenInAcquisitieSelectie items={items} />}\n      <AcquisitieKpis kpis={readiness.kpis} />'
          if old not in s:
              raise SystemExit('render anchor ontbreekt')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/acquisitie-2a3-regressiefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/offmarket/acquisitie/AcquisitieSelectieTab.tsx
          git commit -m "fix(acquisitie): mount Vastgoedkansen-sectie alleen wanneer aanwezig"
          git push origin HEAD:feat/acquisitie-workflow-2-0a3-polymorfe-selectie
