name: CRM Eenduidige Kandidaatworkflow Verify
on:
  push:
    branches: [feat/unieke-kandidaatworkflow-20261115]
    paths:
      - 'src/lib/pipeline/basisKandidaat*'
      - 'src/lib/matching/relatieObjectBesluiten*'
      - 'src/hooks/useObjectMatchBesluiten.ts'
      - 'src/components/pipeline/KandidaatVoorstellenR2.tsx'
      - 'src/components/pipeline/KandidaatSelectieDialog.tsx'
      - 'src/components/relatie/ObjectvoorstellenPanel.tsx'
      - '.github/workflows/crm-eenduidige-kandidaten-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-eenduidige-kandidaten-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-package-lock
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Match- en pipelinetests
        run: npx vitest run src/lib/pipeline/basisKandidaat.test.ts src/lib/matching/relatieObjectBesluiten.test.ts src/lib/matching/rolMandaatAdapter.test.ts src/lib/matching/relatieObjectVoorstellenR2.test.ts src/lib/matching/voorstelPrioriteit.test.ts src/lib/matching/rendementsOordeel.test.ts src/test/pipeline/kandidaatToevoegen.test.ts
      - name: Production build
        run: npm run build
