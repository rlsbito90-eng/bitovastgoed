name: CRM Objectkaart Contacten & Acties Verify
on:
  push:
    branches: [feat/objectkaart-contacten-acties-20261117]
    paths:
      - 'src/pages/ObjectDetailPage.tsx'
      - 'src/components/object/ObjectContactenSectie*'
      - 'src/test/object/objectContactenEnActies.test.ts'
      - '.github/workflows/crm-objectkaart-contacten-acties-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-objectkaart-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-package-lock
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Objectcontacten, acties en regressie
        run: npx vitest run src/components/object/ObjectContactenSectie.test.tsx src/test/object/objectContactenEnActies.test.ts src/test/object/objectDetailGekoppeldeRelatie.test.tsx src/test/crmCompactCards.test.ts src/test/unifiedVisibleTrajectory.test.ts
      - name: Build
        run: npm run build
