name: CRM A13 party profile validation
on:
  push:
    branches:
      - feature/crm-partijprofiel-a13
permissions:
  contents: read
concurrency:
  group: crm-a13-party-profile-validation
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/feature/crm-partijprofiel-a13'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Party profile model tests
        run: npx vitest run src/lib/relaties/partijprofiel.test.ts
      - name: Production asset build (no deployment)
        run: npm run build
      - name: Full regression
        run: npm test
      - name: Ensure no tracked files changed
        run: git diff --exit-code
