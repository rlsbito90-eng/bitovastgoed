name: Temp patch acquisitie signaal labels

on:
  push:
    branches:
      - fix/acquisitie-signaal-labels

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/acquisitie-signaal-labels
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pas gerichte patch toe
        run: python scripts/tmp-patch-acquisitie-signaal-labels.py
      - name: Verwijder tijdelijke patch-infrastructuur
        run: |
          git rm scripts/tmp-patch-acquisitie-signaal-labels.py
          git rm .github/workflows/tmp-patch-acquisitie-signaal-labels.yml
      - name: Commit en push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/offmarket/acquisitie/AcquisitieSelectieTab.tsx src/components/offmarket/acquisitie/FocusModus.tsx src/components/offmarket/acquisitie/VastgoedkansenInAcquisitieSelectie.tsx
          git commit -m "BUILD acquisitie: toon concrete signaalherkomst"
          git push origin HEAD:fix/acquisitie-signaal-labels
