name: CRM Direct Locatie, Aanbieding & Onderhoud Verify
on:
  push:
    branches: [feat/crm-inline-locatie-aanbod-onderhoud-20261118]
    paths:
      - 'src/components/object/ObjectLocatieInline*'
      - 'src/components/object/ObjectAanbiedingInline*'
      - 'src/components/object/ObjectOnderhoudInline*'
      - 'src/lib/objecten/inlineLocatie*'
      - 'src/components/object/ObjectCommercieelInline.tsx'
      - 'src/pages/ObjectDetailPage.tsx'
      - 'src/test/object/objectInlineLocatieAanbodOnderhoud.test.ts'
      - '.github/workflows/crm-inline-locatie-onderhoud-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-inline-locatie-onderhoud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-package-lock
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Inline locatie en regressietests
        run: npx vitest run src/lib/objecten/inlineLocatie.test.ts src/components/object/ObjectLocatieInline.test.tsx src/components/object/ObjectAanbiedingInline.test.tsx src/components/object/ObjectOnderhoudInline.test.tsx src/test/object/objectInlineLocatieAanbodOnderhoud.test.ts src/components/object/ObjectCommercieelInline.test.tsx src/components/object/ObjectFysiekInline.test.tsx src/components/object/ObjectClassificatieInline.test.tsx src/test/object/objectInlineFysiek.test.ts src/test/crmCompactCards.test.ts src/test/unifiedObjectLifecycleUx.test.ts src/test/object/objectContactenEnActies.test.ts src/test/object/objectCockpitOpvolging.test.ts src/test/object/objectDetailKadasterTab.test.ts
      - name: Productiebuild
        run: npm run build
