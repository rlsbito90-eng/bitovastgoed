name: Apply PDOK grid selection

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-pdok-grid.yml']

permissions:
  contents: write

jobs:
  apply-test-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch target branch
        run: |
          git fetch origin fix/pdok-gebiedsdekkende-selectie
          git checkout -B fix/pdok-gebiedsdekkende-selectie origin/fix/pdok-gebiedsdekkende-selectie
          git show origin/main:.github/scripts/apply-pdok-grid.py > /tmp/apply-pdok-grid.py
          python /tmp/apply-pdok-grid.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pdokBagSelectie.ts src/pages/VastgoedkansenVindenPage.tsx src/test/vastgoedkansen/pdokBagSelectie.test.ts
          git commit -m "fix: doorzoek grote gemeenten gebiedsdekkend"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-package-lock
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: git push origin HEAD:fix/pdok-gebiedsdekkende-selectie
      - name: Cleanup main
        if: always()
        run: |
          git checkout -B main origin/main
          git rm .github/workflows/apply-pdok-grid.yml .github/scripts/apply-pdok-grid.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: verwijder tijdelijke PDOK-rasterworkflow"
          git push origin HEAD:main
