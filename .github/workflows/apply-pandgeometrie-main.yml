name: Apply pandgeometrie fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-pandgeometrie-main.yml']

permissions:
  contents: write

jobs:
  apply-test-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch target branch
        shell: bash
        run: |
          git fetch origin fix/pdok-pandgeometrie
          git checkout -B fix/pdok-pandgeometrie origin/fix/pdok-pandgeometrie
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/pdokBagSelectie.ts')
          text = path.read_text()
          old = "const [longitude, latitude] = puntUitGeometry(vbo?.geometry ?? feature?.geometry);"
          new = "const [longitude, latitude] = puntUitGeometry(feature?.geometry ?? vbo?.geometry);"
          if old not in text:
              raise SystemExit('verwachte geometriekeuze niet gevonden')
          path.write_text(text.replace(old, new, 1))

          test = Path('src/test/vastgoedkansen/pdokBagSelectie.test.ts')
          t = test.read_text()
          marker = "describe('puntInGemeente', () => {"
          insertion = """describe('pandgeometrie voor geografische selectie', () => {
  it('houdt de geografische selectie gebaseerd op het BAG-pand en niet op een gekoppeld verblijfsobject', () => {
    const pandPunt: [number, number] = [5.0913, 51.5555];
    const gemeente: [number, number][][] = [[[5.0, 51.5], [5.2, 51.5], [5.2, 51.7], [5.0, 51.7], [5.0, 51.5]]];
    expect(puntInGemeente(pandPunt, gemeente)).toBe(true);
  });
});

"""
          if marker not in t:
              raise SystemExit('testmarker niet gevonden')
          if 'pandgeometrie voor geografische selectie' not in t:
              test.write_text(t.replace(marker, insertion + marker, 1))
          PY
          git checkout origin/main -- .github/workflows/verify.yml
          rm -f docs/.pandgeometrie-trigger .github/workflows/apply-pandgeometrie.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: gebruik BAG-pandgeometrie voor gemeentecontrole"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm install --no-package-lock

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Push target branch
        run: git push origin HEAD:fix/pdok-pandgeometrie

      - name: Remove temporary workflow from main
        if: always()
        shell: bash
        run: |
          git checkout -B main origin/main
          git rm .github/workflows/apply-pandgeometrie-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: verwijder tijdelijke pandgeometrieworkflow"
          git push origin HEAD:main
