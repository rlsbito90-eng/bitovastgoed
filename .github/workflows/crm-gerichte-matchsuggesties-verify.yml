name: CRM Gerichte Matchsuggesties Verify

on:
  push:
    branches:
      - feat/gerichte-matchsuggesties-20261115
    paths:
      - 'src/lib/matching/rolMandaatAdapter.ts'
      - 'src/lib/matching/rendementsOordeel*'
      - 'src/lib/matching/voorstelPrioriteit*'
      - 'src/components/relatie/ObjectvoorstellenPanel.tsx'
      - '.github/workflows/crm-gerichte-matchsuggesties-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-gerichte-matching-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-package-lock
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Matchtests
        run: npx vitest run src/lib/matching/rolMandaatAdapter.test.ts src/lib/matching/relatieObjectVoorstellenR2.test.ts src/lib/matching/rendementsOordeel.test.ts src/lib/matching/voorstelPrioriteit.test.ts
      - name: Production build
        run: npm run build
