name: Tijdelijke Pandenverkenner 1G.3 patch
on:
  push:
    branches: [feat/pandenverkenner-saved-searches-v2]
    paths:
      - scripts/tmp-patch-pandenverkenner-1g3.mjs
      - .github/workflows/tmp-patch-pandenverkenner-1g3.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pandenverkenner-saved-searches-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tmp-patch-pandenverkenner-1g3.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/bag/BagServicePandenlijst.tsx src/components/bag/BagPandenKaart.tsx experiments/bag/pandenverkenner-map-v2.sql src/test/bag/pandenverkennerWorkflowPersistence.test.ts src/test/bag/pandenverkennerMapV2.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(bag): implementeer Saved Searches v2 en kaartpolish"
          git push
