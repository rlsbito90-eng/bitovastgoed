name: Run Pandenverkenner kaartworkflow focus patch
on:
  push:
    branches:
      - fix/pandenverkenner-kaart-workflow-focus
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pandenverkenner-kaart-workflow-focus
      - run: node scripts/dev/apply-pandenverkenner-kaart-workflow-focus.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/bag/BagServicePandenlijst.tsx src/components/bag/BagPandenKaart.tsx src/test/bag/pandenverkennerKaartWorkflowFocus.test.ts
          git commit -m "fix(bag): herstel kaartpreflight en focus geselecteerd pand"
          git push origin HEAD:fix/pandenverkenner-kaart-workflow-focus
