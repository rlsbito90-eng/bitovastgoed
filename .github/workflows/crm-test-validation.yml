name: CRM test branch validation
on:
  push:
    branches: [crm-test]
permissions:
  contents: read
concurrency:
  group: crm-test-validation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Relevant CRM regression tests
        run: npx vitest run src/lib/objecten/adresModel.test.ts src/lib/matching/samenstellingscriterium.test.ts src/test/objecten/adresModelProefPage.test.tsx src/test/objecten/objectenLijstGroepering.test.ts src/test/objecten/crmObjectnummer.test.ts src/test/forms/objectQuickCreateDialog.test.tsx src/test/objectenViewState.test.ts src/test/object/portefeuilleOnderdelen.test.ts
      - name: Build
        run: npm run build
