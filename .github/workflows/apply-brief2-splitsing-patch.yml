name: Apply Brief 2 splitsing patch
on:
  push:
    branches: [feat/acquisitie-brief2-splitsing]
    paths:
      - '.github/scripts/apply-brief2-splitsing-patch.mjs'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node .github/scripts/apply-brief2-splitsing-patch.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/acquisitie/postCopyVarianten.ts src/components/offmarket/BriefVoorbereidenDialog.tsx docs/acquisitie/CLAUDE_BRIEF_2_SPLITSING_BRIEFING.md
          git diff --cached --quiet && exit 0
          git commit -m "BUILD acquisitie: maak Splitsing Brief 2 operationeel"
          git push
