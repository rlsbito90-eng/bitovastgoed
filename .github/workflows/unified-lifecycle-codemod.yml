name: Unified lifecycle codemod

on:
  push:
    branches:
      - feat/unified-object-deal-lifecycle
    paths:
      - .github/unified-lifecycle-codemod.trigger

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.head_commit.message == 'run unified lifecycle codemod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-object-deal-lifecycle
          fetch-depth: 0

      - name: Apply scoped CRM lifecycle UX codemod
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # -----------------------------------------------------------------
          # ObjectFormDialog: status is no longer editable from the general
          # edit form. Availability is managed centrally from Dealflow.
          # -----------------------------------------------------------------
          path = Path('src/components/forms/ObjectFormDialog.tsx')
          text = path.read_text()

          text = replace_once(
              text,
              "  ObjectVastgoed, AssetClass, VerhuurStatus, ObjectStatus,\n  Energielabel, OnderhoudsstaatNiveau, VerkoperVia,\n",
              "  ObjectVastgoed, AssetClass, VerhuurStatus,\n  Energielabel, OnderhoudsstaatNiveau, VerkoperVia,\n",
              'remove ObjectStatus import',
          )
          text = replace_once(
              text,
              "import ArchiveerDialog from '@/components/ArchiveerDialog';\n",
              "",
              'remove ArchiveerDialog import',
          )
          text = replace_once(
              text,
              "  status: 'te_beoordelen',\n",
              "  status: 'beschikbaar',\n",
              'new object availability default',
          )
          text = replace_once(
              text,
              "  // Archief-modal state — opent vóór save bij eindstatus\n  const [archiefOpen, setArchiefOpen] = useState(false);\n\n  const finalStatussen: ObjectStatus[] = ['verkocht', 'ingetrokken', 'afgevallen'];\n  const defaultReasonVoorStatus = (s: ObjectStatus): string => {\n    if (s === 'verkocht') return 'Verkocht via Bito Vastgoed';\n    if (s === 'ingetrokken') return 'Ingetrokken door eigenaar';\n    return 'Succesvol afgerond';\n  };\n\n",
              "",
              'remove edit-form archive state',
          )
          text = replace_once(
              text,
              "    const triggertArchief = finalStatussen.includes(form.status)\n      && (!object || !object.isArchived);\n    if (triggertArchief) {\n      setArchiefOpen(true);\n      return;\n    }\n",
              "",
              'remove edit-form terminal status handling',
          )
          text = replace_once(
              text,
              "                  <Veld label=\"Objectstatus\">\n                    <select\n                      className=\"flex h-10 w-full rounded-md border border-input bg-background px-3 text-sm\"\n                      value={form.status}\n                      onChange={e => set('status', e.target.value as ObjectStatus)}\n                    >\n                      <option value=\"te_beoordelen\">Te beoordelen</option>\n                      <option value=\"beschikbaar\">Beschikbaar</option>\n                      <option value=\"on_hold\">On hold</option>\n                      <option value=\"onder_optie\">Onder optie</option>\n                      <option value=\"verkocht\">Verkocht</option>\n                      <option value=\"ingetrokken\">Ingetrokken</option>\n                      <option value=\"afgevallen\">Afgevallen</option>\n                    </select>\n                  </Veld>\n",
              "",
              'remove duplicate Objectstatus control',
          )
          text = replace_once(
              text,
              "\n      <ArchiveerDialog\n        open={archiefOpen}\n        onOpenChange={setArchiefOpen}\n        kind=\"object\"\n        defaultReason={defaultReasonVoorStatus(form.status)}\n        showSkip\n        triggerHint={`Status wijzigt naar \"${form.status === 'verkocht' ? 'Verkocht' : form.status === 'ingetrokken' ? 'Ingetrokken' : 'Afgevallen'}\". Archiveer direct mee, of bewaar alleen de status.`}\n        onConfirm={async ({ reason, note }) => {\n          setArchiefOpen(false);\n          await persist({\n            isArchived: true,\n            archivedAt: new Date().toISOString(),\n            archivedReason: reason,\n            archivedNote: note,\n          }, 'Object gearchiveerd en verplaatst naar Archief.');\n        }}\n        onSkip={() => {\n          // Save status zonder archiveren — overschrijf auto-archief in store\n          persist({ isArchived: false, archivedAt: undefined, archivedReason: undefined, archivedNote: undefined });\n        }}\n      />",
              "",
              'remove edit-form ArchiveerDialog',
          )
          path.write_text(text)

          # -----------------------------------------------------------------
          # DashboardPage: Object-first executive layer. The lower legacy
          # transaction pipeline remains intact for backwards compatibility,
          # but the page headline and primary KPIs now start from Objects.
          # -----------------------------------------------------------------
          path = Path('src/pages/DashboardPage.tsx')
          text = path.read_text()

          text = replace_once(
              text,
              "import { useDataStore } from '@/hooks/useDataStore';\n",
              "import { useDataStore } from '@/hooks/useDataStore';\nimport { useUnifiedFeeReporting } from '@/hooks/useUnifiedFeeReporting';\n",
              'add unified fee reporting import',
          )
          text = replace_once(
              text,
              "  const nu = new Date();\n  const [planningRows, setPlanningRows] = useState<TaskPlanningMeta[]>([]);\n",
              "  const nu = new Date();\n  const unifiedFees = useUnifiedFeeReporting(nu.getFullYear());\n  const [planningRows, setPlanningRows] = useState<TaskPlanningMeta[]>([]);\n",
              'initialize unified fees',
          )
          text = replace_once(
              text,
              "  const pipelineWaardeTotaal = useMemo(\n    () => actieveDeals.reduce((s, d) => s + (store.getObjectById(d.objectId)?.vraagprijs ?? 0), 0),\n    [actieveDeals, store],\n  );\n",
              "  const pipelineWaardeTotaal = useMemo(\n    () => actieveDeals.reduce((s, d) => s + (store.getObjectById(d.objectId)?.vraagprijs ?? 0), 0),\n    [actieveDeals, store],\n  );\n\n  const actiefAanbodvolume = useMemo(\n    () => actieveObjecten.reduce((som, object) => som + (object.vraagprijs ?? 0), 0),\n    [actieveObjecten],\n  );\n\n  const dashboardPipelineFee = unifiedFees.error\n    ? commissieStats.pipelineBedragTotaal\n    : unifiedFees.stats.pipelineBedrag;\n",
              'add object-first dashboard metrics',
          )
          text = replace_once(
              text,
              "        subtitle={<>{actieveDeals.length} actieve deals · {formatCurrencyCompact(pipelineWaardeTotaal)} pipeline</>}\n",
              "        subtitle={<>{actieveObjecten.length} actieve objecten · {beschikbareObjecten} beschikbaar · {formatCurrencyCompact(actiefAanbodvolume)} aanbod</>}\n",
              'object-first dashboard subtitle',
          )
          text = replace_once(
              text,
              "      <Link to=\"/deals\" className=\"kpi-hero block group\">\n",
              "      <Link to=\"/objecten\" className=\"kpi-hero block group\">\n",
              'hero links to objects',
          )
          text = replace_once(
              text,
              "            <p className=\"kpi-label\">Pipeline waarde</p>\n            <p className=\"kpi-hero-value mt-2.5\">{formatCurrencyCompact(pipelineWaardeTotaal)}</p>\n            <p className=\"text-[12px] text-muted-foreground mt-2.5 tracking-tight\">\n              Totale potentiële dealwaarde · {actieveDeals.length} actieve deals\n            </p>\n",
              "            <p className=\"kpi-label\">Actief aanbodvolume</p>\n            <p className=\"kpi-hero-value mt-2.5\">{formatCurrencyCompact(actiefAanbodvolume)}</p>\n            <p className=\"text-[12px] text-muted-foreground mt-2.5 tracking-tight\">\n              {actieveObjecten.length} actieve objecten · {beschikbareObjecten} direct beschikbaar\n            </p>\n",
              'object-first hero',
          )
          text = replace_once(
              text,
              "            <p className=\"text-[9.5px] sm:text-[10px] font-semibold text-muted-foreground uppercase tracking-[0.12em]\">Potentiële commissie</p>\n            <p className=\"font-mono-data text-[15px] sm:text-[17px] font-semibold text-foreground mt-1 leading-none truncate\">\n              {formatCurrencyCompact(commissieStats.pipelineBedragTotaal)}\n            </p>\n            <p className=\"text-[10px] text-muted-foreground mt-1 leading-none truncate\">Gewogen: {formatCurrencyCompact(commissieStats.pipelineBedragGewogen)}</p>\n",
              "            <p className=\"text-[9.5px] sm:text-[10px] font-semibold text-muted-foreground uppercase tracking-[0.12em]\">Fee pipeline</p>\n            <p className=\"font-mono-data text-[15px] sm:text-[17px] font-semibold text-foreground mt-1 leading-none truncate\">\n              {formatCurrencyCompact(dashboardPipelineFee)}\n            </p>\n            <p className=\"text-[10px] text-muted-foreground mt-1 leading-none truncate\">1 economische fee per object</p>\n",
              'canonical fee in hero',
          )
          text = replace_once(
              text,
              "            <p className=\"text-[9.5px] sm:text-[10px] font-semibold text-muted-foreground uppercase tracking-[0.12em]\">In closing</p>\n            <p className=\"font-mono-data text-[15px] sm:text-[17px] font-semibold text-foreground mt-1 leading-none\">{closingDeals.length}</p>\n",
              "            <p className=\"text-[9.5px] sm:text-[10px] font-semibold text-muted-foreground uppercase tracking-[0.12em]\">Concrete Deals</p>\n            <p className=\"font-mono-data text-[15px] sm:text-[17px] font-semibold text-foreground mt-1 leading-none\">{actieveDeals.length}</p>\n",
              'concrete Deal count in hero',
          )
          text = replace_once(
              text,
              "      <div className=\"grid grid-cols-2 lg:grid-cols-4 gap-2.5 lg:gap-4\">\n        <KPICard label=\"Actieve deals\" value={actieveDeals.length} hint={`${formatCurrencyCompact(pipelineWaardeTotaal)} pipeline`} icon={Activity} tone=\"primary\" href=\"/deals\" />\n        <KPICard label=\"Potentiële commissie\" value={formatCurrencyCompact(commissieStats.pipelineBedragTotaal)} hint={`Gewogen: ${formatCurrencyCompact(commissieStats.pipelineBedragGewogen)}`} icon={Banknote} tone=\"accent\" href=\"/rapportage\" />\n        <KPICard label=\"Deals in closing\" value={closingDeals.length} hint=\"Bieding → closing\" icon={Target} tone=\"success\" href=\"/deals?fase=closing\" />\n        <KPICard label=\"Open acties\" value={urgentCount} hint={`${taakVandaag.length} vandaag · ${taakAchterstallig.length} achterstallig`} icon={AlertTriangle} tone={urgentCount > 0 ? 'warning' : 'muted'} href=\"/taken\" />\n      </div>\n",
              "      <div className=\"grid grid-cols-2 lg:grid-cols-4 gap-2.5 lg:gap-4\">\n        <KPICard label=\"Actieve objecten\" value={actieveObjecten.length} hint={`${formatCurrencyCompact(actiefAanbodvolume)} aanbod`} icon={Building2} tone=\"primary\" href=\"/objecten\" />\n        <KPICard label=\"Beschikbaar\" value={beschikbareObjecten} hint=\"Direct inzetbaar voor matching\" icon={Activity} tone=\"success\" href=\"/objecten\" />\n        <KPICard label=\"Fee pipeline\" value={formatCurrencyCompact(dashboardPipelineFee)} hint=\"Objectforecast → concrete Deal\" icon={Banknote} tone=\"accent\" href=\"/rapportage\" />\n        <KPICard label=\"Open acties\" value={urgentCount} hint={`${taakVandaag.length} vandaag · ${taakAchterstallig.length} achterstallig`} icon={AlertTriangle} tone={urgentCount > 0 ? 'warning' : 'muted'} href=\"/taken\" />\n      </div>\n",
              'object-first primary KPI cards',
          )
          path.write_text(text)
          PY

      - name: Commit scoped changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/forms/ObjectFormDialog.tsx src/pages/DashboardPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "CRM: finish object-first status and dashboard UX"
          git push origin HEAD:feat/unified-object-deal-lifecycle
