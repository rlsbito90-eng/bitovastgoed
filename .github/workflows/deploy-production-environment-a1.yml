name: Deploy CRM objectnummer A1 via production environment

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  deploy:
    if: github.head_ref == 'ops/deploy-production-environment-a1'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect production environment credentials
        id: caps
        shell: bash
        run: |
          db=false; supabase=false; vercel=false; netlify=false; cloudflare=false
          [[ -n "$SUPABASE_DATABASE_URL" || -n "$DATABASE_URL" ]] && db=true
          [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]] && supabase=true
          [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]] && vercel=true
          [[ -n "$NETLIFY_AUTH_TOKEN" && -n "$NETLIFY_SITE_ID" ]] && netlify=true
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_PAGES_PROJECT" ]] && cloudflare=true
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "supabase=$supabase" >> "$GITHUB_OUTPUT"
          echo "vercel=$vercel" >> "$GITHUB_OUTPUT"
          echo "netlify=$netlify" >> "$GITHUB_OUTPUT"
          echo "cloudflare=$cloudflare" >> "$GITHUB_OUTPUT"
          echo "Database URL: $db" >> "$GITHUB_STEP_SUMMARY"
          echo "Supabase CLI: $supabase" >> "$GITHUB_STEP_SUMMARY"
          echo "Vercel: $vercel" >> "$GITHUB_STEP_SUMMARY"
          echo "Netlify: $netlify" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare Pages: $cloudflare" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migration via database URL
        if: steps.caps.outputs.db == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql "${SUPABASE_DATABASE_URL:-$DATABASE_URL}" -v ON_ERROR_STOP=1 -f supabase/migrations/20260802021000_add_crm_objectnummer.sql

      - name: Apply migration via Supabase CLI
        if: steps.caps.outputs.db != 'true' && steps.caps.outputs.supabase == 'true'
        shell: bash
        run: |
          npx --yes supabase@latest link --project-ref ljudxyrqoifhfikueric --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Install dependencies
        if: steps.caps.outputs.vercel == 'true' || steps.caps.outputs.netlify == 'true' || steps.caps.outputs.cloudflare == 'true'
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Deploy Vercel
        if: steps.caps.outputs.vercel == 'true'
        shell: bash
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy Netlify
        if: steps.caps.outputs.vercel != 'true' && steps.caps.outputs.netlify == 'true'
        shell: bash
        run: |
          npm run build
          npx --yes netlify-cli@latest deploy --prod --dir=dist --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID"

      - name: Deploy Cloudflare Pages
        if: steps.caps.outputs.vercel != 'true' && steps.caps.outputs.netlify != 'true' && steps.caps.outputs.cloudflare == 'true'
        shell: bash
        run: |
          npm run build
          npx --yes wrangler@latest pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main --commit-dirty=true

      - name: Require database route
        if: steps.caps.outputs.db != 'true' && steps.caps.outputs.supabase != 'true'
        run: exit 31

      - name: Require frontend route
        if: steps.caps.outputs.vercel != 'true' && steps.caps.outputs.netlify != 'true' && steps.caps.outputs.cloudflare != 'true'
        run: exit 32
