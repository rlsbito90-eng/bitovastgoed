name: BAG Amsterdam chunks 02-08 sequential

on:
  push:
    branches:
      - feat/acquisitie-kadaster-readmodel
    paths:
      - .github/workflows/bag-amsterdam-chunks-02-08-sequential.yml

permissions:
  contents: read

jobs:
  metadata-chunk:
    name: Metadata ${{ matrix.chunk_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chunk_id:
          - chunk-02
          - chunk-03
          - chunk-04
          - chunk-05
          - chunk-06
          - chunk-07
          - chunk-08
    concurrency:
      group: bag-amsterdam-metadata-${{ matrix.chunk_id }}
      cancel-in-progress: false
    env:
      BAG_NL_SOURCE_URL: https://service.pdok.nl/kadaster/adressen/atom/v1_0/downloads/lvbag-extract-nl.zip
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Valideer lokale chunkextractor
        run: python3 scripts/bag/test-extract-amsterdam-metadata-chunk.py

      - name: Download officiële landelijke BAG-bron
        run: |
          mkdir -p bag-amsterdam-metadata/download bag-amsterdam-metadata/resultaat
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 60 --max-time 10800 \
            "$BAG_NL_SOURCE_URL" \
            --output bag-amsterdam-metadata/download/lvbag-extract-nl.zip
          unzip -t bag-amsterdam-metadata/download/lvbag-extract-nl.zip

      - name: Bouw hetzelfde deterministische acht-chunkmanifest
        run: |
          python3 scripts/bag/build-amsterdam-chunk-manifest.py \
            bag-amsterdam-metadata/download/lvbag-extract-nl.zip \
            bag-amsterdam-metadata/resultaat/bron-en-chunkmanifest.json \
            --chunks 8

      - name: Extraheer metadata voor gekozen chunk
        run: |
          timeout --signal=TERM --kill-after=2m 260m \
            python3 scripts/bag/extract-amsterdam-metadata-chunk.py \
              bag-amsterdam-metadata/download/lvbag-extract-nl.zip \
              bag-amsterdam-metadata/resultaat/bron-en-chunkmanifest.json \
              '${{ matrix.chunk_id }}' \
              bag-amsterdam-metadata/resultaat/${{ matrix.chunk_id }}-metadata.ndjson.gz \
              bag-amsterdam-metadata/resultaat/${{ matrix.chunk_id }}-rapport.json

      - name: Verwijder grote bron en volledig manifest
        if: always()
        run: |
          rm -f bag-amsterdam-metadata/download/lvbag-extract-nl.zip
          rm -f bag-amsterdam-metadata/resultaat/bron-en-chunkmanifest.json

      - name: Publiceer compacte chunkmetadata en rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bag-amsterdam-metadata-${{ matrix.chunk_id }}
          if-no-files-found: error
          retention-days: 14
          path: bag-amsterdam-metadata/resultaat/
