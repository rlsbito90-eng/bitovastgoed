name: Apply Pandenverkenner kaartworkflow focus fix

on:
  push:
    branches:
      - fix/pandenverkenner-kaart-workflow-focus

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pandenverkenner-kaart-workflow-focus
      - name: Apply focused frontend fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lijst = Path('src/components/bag/BagServicePandenlijst.tsx')
          text = lijst.read_text()
          old = '''    {weergave === 'kaart' && <>
      <BagPandenKaart scopeCode={scopeCode} filters={kaartFilters} geselecteerdeIds={geselecteerd} onKandidaatToggle={toggleKaartKandidaat} />
      {geselecteerd.size > 0 && <div className="flex items-center justify-between gap-3 border-b bg-muted/10 px-4 py-3 text-sm"><span>{geselecteerd.size} kandidaat{geselecteerd.size === 1 ? '' : 'panden'} geselecteerd</span><Button size="sm" onClick={() => setPreflight(beoordeelBagSelectie(selectiePanden, geselecteerd, context))}><CheckCircle2 className="mr-1.5 h-4 w-4" />Controleer selectie</Button></div>}
    </>}'''
          new = '''    {weergave === 'kaart' && <>
      <BagPandenKaart scopeCode={scopeCode} filters={kaartFilters} geselecteerdeIds={geselecteerd} onKandidaatToggle={toggleKaartKandidaat} />
      {geselecteerd.size > 0 && <div className="flex items-center justify-between gap-3 border-b bg-muted/10 px-4 py-3 text-sm"><span>{geselecteerd.size} kandidaat{geselecteerd.size === 1 ? '' : 'panden'} geselecteerd</span><Button size="sm" onClick={() => setPreflight(beoordeelBagSelectie(selectiePanden, geselecteerd, context))}><CheckCircle2 className="mr-1.5 h-4 w-4" />Controleer selectie</Button></div>}
      {preflight && <div className={`border-b p-4 text-sm ${preflight.toegestaan ? 'bg-emerald-500/5' : 'bg-amber-500/5'}`}><div className="flex flex-wrap items-start justify-between gap-3"><div><p className="font-medium">{preflight.toegestaan ? 'Selectie technisch gereed voor handmatige promotie' : 'Selectie geblokkeerd'}</p><p className="mt-1 text-xs text-muted-foreground">{preflight.geselecteerd} gecontroleerd · {preflight.kandidaten.length} kandidaat · {preflight.blokkades.length} blokkade(s). Er is niets opgeslagen.</p></div>{preflight.toegestaan&&<Button size="sm" onClick={() => setPromotieOpen(true)}>Handmatig toevoegen…</Button>}</div>{preflight.blokkades.length>0&&<ul className="mt-2 list-disc pl-5 text-xs">{preflight.blokkades.map(item=><li key={`${item.bagPandId}:${item.reden}`}>{item.bagPandId}: {REDEN_LABEL[item.reden]}</li>)}</ul>}</div>}
    </>}'''
          if old not in text:
              raise SystemExit('kaart flow target not found')
          lijst.write_text(text.replace(old, new, 1))

          kaart = Path('src/components/bag/BagPandenKaart.tsx')
          text = kaart.read_text()
          text = text.replace("  const mapRef = useRef<MapRef | null>(null);\n", "  const mapRef = useRef<MapRef | null>(null);\n  const focusBewegingRef = useRef(false);\n", 1)

          target = '''      setGeselecteerd({
        id: String(properties.id),
        adres: String(properties.adres ?? ''),
        postcode: String(properties.postcode ?? ''),
        plaats: String(properties.plaats ?? ''),
        status: String(properties.status ?? ''),
        bouwjaar: properties.bouwjaar == null ? null : Number(properties.bouwjaar),
        gbo: properties.gbo == null ? null : Number(properties.gbo),
        vboAantal: properties.vboAantal == null ? null : Number(properties.vboAantal),
        wijk: String(properties.wijk ?? ''),
        buurt: String(properties.buurt ?? ''),
      });'''
          repl = target + '''
      if (feature.geometry.type === 'Point') {
        const map = mapRef.current?.getMap();
        if (map) {
          focusBewegingRef.current = true;
          map.easeTo({
            center: (feature.geometry as Point).coordinates as [number, number],
            zoom: Math.max(map.getZoom(), 16),
            offset: [0, 110],
            duration: 420,
          });
        }
      }'''
          if target not in text:
              raise SystemExit('pand focus target not found')
          text = text.replace(target, repl, 1)
          text = text.replace("          onMoveEnd={() => { if (heeftGezocht) setKaartVerouderd(true); }}", "          onMoveEnd={() => { if (focusBewegingRef.current) { focusBewegingRef.current = false; return; } if (heeftGezocht) setKaartVerouderd(true); }}", 1)
          text = text.replace('              maxWidth="320px"\n              offset={10}', '              maxWidth="320px"\n              anchor="bottom"\n              offset={12}', 1)
          kaart.write_text(text)

          test = Path('src/test/bag/pandenverkennerKaartWorkflowFocus.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';\nimport fs from 'node:fs';\n\nconst lijst = fs.readFileSync('src/components/bag/BagServicePandenlijst.tsx', 'utf8');\nconst kaart = fs.readFileSync('src/components/bag/BagPandenKaart.tsx', 'utf8');\n\ndescribe('Pandenverkenner kaartworkflow en focus', () => {\n  it('toont de preflight en vervolgactie ook binnen de kaartweergave', () => {\n    const kaartStart = lijst.indexOf(\"{weergave === 'kaart' && <>\");\n    const lijstStart = lijst.indexOf(\"<div className={weergave === 'zoeken' ? 'block' : 'hidden'}>\");\n    const kaartBlok = lijst.slice(kaartStart, lijstStart);\n    expect(kaartBlok).toContain('Controleer selectie');\n    expect(kaartBlok).toContain('Selectie technisch gereed voor handmatige promotie');\n    expect(kaartBlok).toContain('Handmatig toevoegen…');\n  });\n\n  it('centreert een aangeklikt pand met ruimte voor de popup zonder kaartdata stale te markeren', () => {\n    expect(kaart).toContain('focusBewegingRef.current = true');\n    expect(kaart).toContain('zoom: Math.max(map.getZoom(), 16)');\n    expect(kaart).toContain('offset: [0, 110]');\n    expect(kaart).toContain('anchor=\"bottom\"');\n    expect(kaart).toContain('if (focusBewegingRef.current) { focusBewegingRef.current = false; return; }');\n  });\n});\n""")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/bag/BagServicePandenlijst.tsx src/components/bag/BagPandenKaart.tsx src/test/bag/pandenverkennerKaartWorkflowFocus.test.ts
          git commit -m "fix(bag): herstel kaartpreflight en focus geselecteerd pand"
          git push origin HEAD:fix/pandenverkenner-kaart-workflow-focus
