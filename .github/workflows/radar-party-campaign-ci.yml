name: Radar party campaign CI

on:
  pull_request:
    paths:
      - 'src/components/offmarket/BriefVoorbereidenKnop.tsx'
      - 'src/components/offmarket/BriefVoorbereidenDialog.tsx'
      - 'src/components/offmarket/acquisitie/**'
      - 'src/hooks/useRadarCampaignMutations.tsx'
      - 'src/hooks/useRadarPartyCampaignContext.tsx'
      - 'src/lib/offMarket/acquisitie/**'
      - 'src/test/offMarket/partyCampaign*.test.ts'
      - 'src/test/offMarket/briefVoorbereidenCampaignGate.test.ts'
      - 'supabase/migrations/*radar_*'
      - '.github/workflows/radar-party-campaign-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-package-lock
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Party campaign routing tests
        run: npx vitest run src/test/offMarket/partyCampaign.test.ts src/test/offMarket/partyCampaignSafety.test.ts src/test/offMarket/briefVoorbereidenCampaignGate.test.ts src/test/offMarket/v37/bulkBriefPlan.test.ts
      - name: Build
        run: npm run build
