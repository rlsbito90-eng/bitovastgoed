name: Temp patch acquisitie opvolgen compact 2

on:
  push:
    branches:
      - fix/acquisitie-opvolgen-compact-2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/acquisitie-opvolgen-compact-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pas gerichte patch toe
        run: python scripts/tmp-patch-acquisitie-opvolgen-compact-2.py
      - name: Verwijder tijdelijke patch-infrastructuur
        run: |
          git rm scripts/tmp-patch-acquisitie-opvolgen-compact-2.py
          git rm .github/workflows/tmp-patch-acquisitie-opvolgen-compact-2.yml
      - name: Commit en push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/offmarket/acquisitie/AcquisitieSelectieTab.tsx
          git commit -m "BUILD acquisitie: verfijn opvolgkaart presentatie"
          git push origin HEAD:fix/acquisitie-opvolgen-compact-2
