name: Apply splitsing variant B patch

on:
  push:
    branches:
      - feat/splitsing-post-b-variant
    paths:
      - '.github/scripts/apply-splitsing-variant-b-patch.mjs'
      - '.github/workflows/apply-splitsing-variant-b-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/splitsing-post-b-variant
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply component patch
        run: node .github/scripts/apply-splitsing-variant-b-patch.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/offmarket/BriefVoorbereidenDialog.tsx
          git commit -m "BUILD acquisitie: koppel toegewezen postvariant aan brieftekst"
          git push origin HEAD:feat/splitsing-post-b-variant
