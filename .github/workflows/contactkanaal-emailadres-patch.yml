name: Apply contactkanaal patch

on:
  push:
    branches:
      - fix/contactkanaal-emailadres

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'BUILD contactkanaal:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contactkanaal-emailadres
          fetch-depth: 0
      - name: Patch kanaalbewuste Post/E-mail flow
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Patroon niet gevonden in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          dialog = 'src/components/offmarket/BriefVoorbereidenDialog.tsx'
          hook = 'src/hooks/useOffMarketBrieven.tsx'

          replace_once(dialog,
          """function isEchteWaarde(v: string | null | undefined): boolean {\n  if (!v) return false;\n  const norm = v.replace(/\\s+/g, ' ').trim().toLowerCase();\n  if (!norm) return false;\n  const ph = VERZENDADRES_PLACEHOLDER.replace(/\\s+/g, ' ').trim().toLowerCase();\n  return norm !== ph;\n}\n""",
          """function isEchteWaarde(v: string | null | undefined): boolean {\n  if (!v) return false;\n  const norm = v.replace(/\\s+/g, ' ').trim().toLowerCase();\n  if (!norm) return false;\n  const ph = VERZENDADRES_PLACEHOLDER.replace(/\\s+/g, ' ').trim().toLowerCase();\n  return norm !== ph;\n}\n\nfunction isEmailWaarde(v: string | null | undefined): boolean {\n  const schoon = v?.trim() ?? '';\n  return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(schoon);\n}\n""")

          replace_once(dialog,
          """  const verzendadresVoorOpslag = (): string | null =>\n    isEchteWaarde(verzendadres) ? verzendadres.trim() : null;\n""",
          """  const verzendadresVoorOpslag = (): string | null => {\n    const schoon = verzendadres.trim();\n    if (kanaal === 'email') return isEmailWaarde(schoon) ? schoon : null;\n    return isEchteWaarde(schoon) ? schoon : null;\n  };\n""")

          replace_once(dialog,
          """  const markeerVerstuurd = async () => {\n    const isEmail = kanaal === 'email';\n    if (!isEmail && !vm.heeftVerzendadres) {\n""",
          """  const markeerVerstuurd = async () => {\n    const isEmail = kanaal === 'email';\n    if (isEmail && !isEmailWaarde(verzendadres)) {\n      toast.error('Vul eerst een geldig e-mailadres in.');\n      return;\n    }\n    if (!isEmail && !vm.heeftVerzendadres) {\n""")

          old_preview = """          {/* Geadresseerde-preview — exact zoals deze in PDF/kopie verschijnt. */}\n          <div\n            data-testid=\"brief-geadresseerde-preview\"\n            className=\"rounded-md border bg-muted/30 p-3 text-sm leading-relaxed\"\n          >\n            <div className=\"text-[10px] uppercase tracking-wide text-muted-foreground mb-1.5\">\n              Geadresseerde zoals in PDF\n            </div>\n            {vm.bedrijfsnaam && <div>{vm.bedrijfsnaam}</div>}\n            {vm.geadresseerdeNaam && <div>{vm.geadresseerdeNaam}</div>}\n            {vm.verzendadresRegels.map((r, i) => <div key={i}>{r}</div>)}\n            {(vm.bedrijfsnaam || vm.geadresseerdeNaam) && vm.verzendadresRegels.length === 0 && (\n              <div className=\"text-muted-foreground italic\">Geen verzendadres ingevuld</div>\n            )}\n            {!vm.bedrijfsnaam && !vm.geadresseerdeNaam && vm.verzendadresRegels.length === 0 && (\n              <div className=\"text-muted-foreground italic\">Nog geen geadresseerde-gegevens</div>\n            )}\n          </div>\n"""
          new_preview = """          {/* Kanaalbewuste geadresseerde-preview. */}\n          <div\n            data-testid=\"brief-geadresseerde-preview\"\n            className=\"rounded-md border bg-muted/30 p-3 text-sm leading-relaxed\"\n          >\n            <div className=\"text-[10px] uppercase tracking-wide text-muted-foreground mb-1.5\">\n              {kanaal === 'email' ? 'E-mailgeadresseerde' : 'Geadresseerde zoals in PDF'}\n            </div>\n            {vm.bedrijfsnaam && <div>{vm.bedrijfsnaam}</div>}\n            {vm.geadresseerdeNaam && <div>{vm.geadresseerdeNaam}</div>}\n            {kanaal === 'email' ? (\n              isEmailWaarde(verzendadres)\n                ? <div>E-mail: {verzendadres.trim()}</div>\n                : <div className=\"text-muted-foreground italic\">Geen geldig e-mailadres ingevuld</div>\n            ) : (\n              <>\n                {vm.verzendadresRegels.map((r, i) => <div key={i}>{r}</div>)}\n                {(vm.bedrijfsnaam || vm.geadresseerdeNaam) && vm.verzendadresRegels.length === 0 && (\n                  <div className=\"text-muted-foreground italic\">Geen verzendadres ingevuld</div>\n                )}\n                {!vm.bedrijfsnaam && !vm.geadresseerdeNaam && vm.verzendadresRegels.length === 0 && (\n                  <div className=\"text-muted-foreground italic\">Nog geen geadresseerde-gegevens</div>\n                )}\n              </>\n            )}\n          </div>\n"""
          replace_once(dialog, old_preview, new_preview)

          old_address = """          {/* Verzendadres */}\n          <div className=\"space-y-1.5\">\n            <div className=\"text-[11px] uppercase tracking-wide text-muted-foreground\">Verzendadres</div>\n            <Label htmlFor=\"brief-verzend\" className=\"sr-only\">Verzendadres</Label>\n            <Textarea\n              id=\"brief-verzend\"\n              value={verzendadres}\n              onChange={(e) => {\n                setVerzendadres(e.target.value);\n                setVerzendadresBron('handmatig');\n                setPdfVoorstelKandidaatLabel(null);\n              }}\n              placeholder={kanaal === 'email' ? '' : `Bijv. ${VERZENDADRES_PLACEHOLDER}`}\n              rows={3}\n            />\n            {kadasterRecords.length > 0 && (\n"""
          new_address = """          {/* Contactadres: kanaal bepaalt betekenis en beschikbare hulpmiddelen. */}\n          <div className=\"space-y-1.5\">\n            <div className=\"text-[11px] uppercase tracking-wide text-muted-foreground\">\n              {kanaal === 'email' ? 'E-mailadres' : 'Verzendadres'}\n            </div>\n            <Label htmlFor=\"brief-verzend\" className=\"sr-only\">\n              {kanaal === 'email' ? 'E-mailadres' : 'Verzendadres'}\n            </Label>\n            {kanaal === 'email' ? (\n              <>\n                <Input\n                  id=\"brief-verzend\"\n                  type=\"email\"\n                  inputMode=\"email\"\n                  autoCapitalize=\"none\"\n                  autoCorrect=\"off\"\n                  value={verzendadres}\n                  onChange={(e) => {\n                    setVerzendadres(e.target.value);\n                    setVerzendadresBron('handmatig');\n                    setPdfVoorstelKandidaatLabel(null);\n                  }}\n                  placeholder=\"naam@bedrijf.nl\"\n                />\n                {!isEmailWaarde(verzendadres) && verzendadres.trim() && (\n                  <p className=\"text-[11px] text-amber-600\">Vul een geldig e-mailadres in.</p>\n                )}\n                <p className=\"text-[11px] text-muted-foreground\">\n                  Dit is het contactadres voor deze e-mail. Kadaster-postadresgegevens worden in e-mailmodus niet gebruikt.\n                </p>\n              </>\n            ) : (\n              <>\n                <Textarea\n                  id=\"brief-verzend\"\n                  value={verzendadres}\n                  onChange={(e) => {\n                    setVerzendadres(e.target.value);\n                    setVerzendadresBron('handmatig');\n                    setPdfVoorstelKandidaatLabel(null);\n                  }}\n                  placeholder={`Bijv. ${VERZENDADRES_PLACEHOLDER}`}\n                  rows={3}\n                />\n            {kadasterRecords.length > 0 && (\n"""
          replace_once(dialog, old_address, new_address)

          old_address_end = """            {verzendadresOntbreekt && (\n              <p className=\"text-[11px] text-amber-600\">\n                {geselecteerdeKandidaat?.bron === 'kadaster' && !geselecteerdeKandidaat?.verzendadres\n                  ? 'Voor deze Kadaster-geadresseerde is geen gestructureerd verzendadres beschikbaar. Vul het verzendadres handmatig in.'\n                  : 'Geen verzendadres bekend. Vul dit handmatig aan voordat u de PDF genereert.'}\n              </p>\n            )}\n          </div>\n\n          {/* Objectomschrijving */}\n"""
          new_address_end = """            {verzendadresOntbreekt && (\n              <p className=\"text-[11px] text-amber-600\">\n                {geselecteerdeKandidaat?.bron === 'kadaster' && !geselecteerdeKandidaat?.verzendadres\n                  ? 'Voor deze Kadaster-geadresseerde is geen gestructureerd verzendadres beschikbaar. Vul het verzendadres handmatig in.'\n                  : 'Geen verzendadres bekend. Vul dit handmatig aan voordat u de PDF genereert.'}\n              </p>\n            )}\n              </>\n            )}\n          </div>\n\n          {/* Objectomschrijving */}\n"""
          replace_once(dialog, old_address_end, new_address_end)

          replace_once(dialog,
          """            <div className=\"text-[11px] uppercase tracking-wide text-muted-foreground\">Objectomschrijving in brief</div>\n""",
          """            <div className=\"text-[11px] uppercase tracking-wide text-muted-foreground\">\n              {kanaal === 'email' ? 'Objectomschrijving in e-mail' : 'Objectomschrijving in brief'}\n            </div>\n""")

          replace_once(dialog,
          """                Wordt bewaard voor administratie. De brief gebruikt \"Objectomschrijving in brief\".\n""",
          """                Wordt bewaard voor administratie. {kanaal === 'email' ? 'De e-mail gebruikt \"Objectomschrijving in e-mail\".' : 'De brief gebruikt \"Objectomschrijving in brief\".'}\n""")

          replace_once(hook,
          """      if (input.id) {\n        // Bestaand record — wijzig kanaal/verzendstatus/status niet zomaar.\n        // status wordt geregisseerd door useMarkBriefVerstuurd; een\n        // inhoudelijke upsert mag een verstuurd record nooit terugzetten\n        // naar concept.\n        delete payload.kanaal;\n        delete payload.verzendstatus;\n        delete payload.status;\n        const { data, error } = await (supabase as any)\n          .from(TABLE).update(payload).eq('id', input.id).select().single();\n""",
          """      if (input.id) {\n        // Bestaand concept mag van kanaal wisselen; een reeds verstuurd\n        // record behoudt zijn historische kanaal. Status/verzendstatus\n        // worden uitsluitend door useMarkBriefVerstuurd geregisseerd.\n        const { data: huidig } = await (supabase as any)\n          .from(TABLE).select('status').eq('id', input.id).maybeSingle();\n        if (huidig?.status === 'verstuurd') delete payload.kanaal;\n        delete payload.verzendstatus;\n        delete payload.status;\n        const { data, error } = await (supabase as any)\n          .from(TABLE).update(payload).eq('id', input.id).select().single();\n""")

          replace_once(hook,
          """      const patch: any = {\n        status: 'verstuurd',\n        verzonden_op: iso,\n        verzendstatus: isEmail ? 'verzonden' : 'gepost',\n        postdatum: dagY,\n        opvolgdatum,\n      };\n""",
          """      const patch: any = {\n        status: 'verstuurd',\n        kanaal,\n        verzonden_op: iso,\n        verzendstatus: isEmail ? 'verzonden' : 'gepost',\n        postdatum: dagY,\n        opvolgdatum,\n      };\n""")

          text = Path(hook).read_text()
          text = text.replace("kanaal: brief.kanaal ?? kanaal,", "kanaal,", 2)
          text = text.replace("kanaal: brief.kanaal ?? 'post',\n              event_type: 'posted',", "kanaal,\n              event_type: isEmail ? 'sent' : 'posted',", 1)
          Path(hook).write_text(text)

          test = Path('src/test/offMarket/contactkanaalEmailSemantiek.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';\nimport { readFileSync } from 'node:fs';\n\ndescribe('Post/E-mail semantiek', () => {\n  it('maakt de e-mailmodus expliciet en houdt Kadaster-posthulp buiten het e-mailadresveld', () => {\n    const bron = readFileSync('src/components/offmarket/BriefVoorbereidenDialog.tsx', 'utf8');\n    expect(bron).toContain("kanaal === 'email' ? 'E-mailadres' : 'Verzendadres'");\n    expect(bron).toContain('Kadaster-postadresgegevens worden in e-mailmodus niet gebruikt.');\n    expect(bron).toContain("toast.error('Vul eerst een geldig e-mailadres in.')");\n  });\n\n  it('persisteert het definitieve kanaal bij markeren als verzonden', () => {\n    const bron = readFileSync('src/hooks/useOffMarketBrieven.tsx', 'utf8');\n    expect(bron).toContain("status: 'verstuurd',\\n        kanaal,");\n    expect(bron).toContain("event_type: isEmail ? 'sent' : 'posted'");\n  });\n});\n""")

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/offmarket/BriefVoorbereidenDialog.tsx src/hooks/useOffMarketBrieven.tsx src/test/offMarket/contactkanaalEmailSemantiek.test.ts
          git commit -m "BUILD contactkanaal: maak Post en E-mail semantisch correct"
          git push origin HEAD:fix/contactkanaal-emailadres
