name: Apply remove legacy deal phase codemod

on:
  push:
    branches:
      - fix/unified-visible-trajectory-phase

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/unified-visible-trajectory-phase
          fetch-depth: 0
      - name: Apply guarded codemod
        run: python scripts/codemod_remove_legacy_deal_phase.py
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit codemod result
        run: |
          if git diff --quiet; then
            echo "No codemod changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DealDetailPage.tsx src/pages/DealsPage.tsx src/pages/ObjectDetailPage.tsx src/pages/RelatieDetailPage.tsx src/pages/DashboardPage.tsx src/pages/RapportagePage.tsx
          git commit -m "fix: verwijder legacy Deal-fase uit zichtbare CRM-flow"
          git push origin HEAD:fix/unified-visible-trajectory-phase
