name: CRM R2 branch validation
on:
  push:
    branches:
      - feature/crm-r2-preview
permissions:
  contents: read
concurrency:
  group: crm-r2-branch-validation
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/feature/crm-r2-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 24 (same major as Vercel)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies (no audit/network calls to Supabase)
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Focused matching contract tests
        run: npx vitest run src/lib/matching/rolMandaatAdapter.test.ts
      - name: Production asset build (not a deployment)
        run: npm run build
      - name: Install isolated Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile acceptance with synthetic records
        run: npx playwright test --config playwright.crm-r2.config.ts
      - name: Complete CRM regression tests
        run: npm test
      - name: Ensure no tracked files changed during validation
        run: git diff --exit-code
      - name: Upload synthetic acceptance screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-r2-desktop-mobile-acceptatie
          path: test-results/r2-*.png
          if-no-files-found: warn
          retention-days: 3
