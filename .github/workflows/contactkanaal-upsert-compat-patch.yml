name: Apply contact channel upsert compatibility fix

on:
  push:
    branches:
      - fix/contactkanaal-emailadres

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'FIX contactkanaal upsert:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contactkanaal-emailadres
          fetch-depth: 0
      - name: Patch upsert contract
        shell: python
        run: |
          from pathlib import Path

          hook = Path('src/hooks/useOffMarketBrieven.tsx')
          text = hook.read_text()
          old = """    mutationFn: async (\n      input: BriefInsert & { id?: string },\n    ): Promise<OffMarketBrief> => {\n"""
          new = """    mutationFn: async (\n      input: BriefInsert & { id?: string; kanaal_wijzigen?: boolean },\n    ): Promise<OffMarketBrief> => {\n"""
          if old not in text: raise SystemExit('input signature not found')
          text = text.replace(old, new, 1)

          old = """      if (input.id) {\n        // Bestaand concept mag van kanaal wisselen; een reeds verstuurd\n        // record behoudt zijn historische kanaal. Status/verzendstatus\n        // worden uitsluitend door useMarkBriefVerstuurd geregisseerd.\n        const { data: huidig } = await (supabase as any)\n          .from(TABLE).select('status').eq('id', input.id).maybeSingle();\n        if (huidig?.status === 'verstuurd') delete payload.kanaal;\n        delete payload.verzendstatus;\n"""
          new = """      if (input.id) {\n        // Historisch contract: een generieke inhoudelijke update verandert\n        // het kanaal niet impliciet. Alleen de kanaalkeuze in de\n        // voorbereidingsflow mag dit expliciet doen voor een concept.\n        if (!input.kanaal_wijzigen) delete payload.kanaal;\n        delete payload.verzendstatus;\n"""
          if old not in text: raise SystemExit('existing update block not found')
          text = text.replace(old, new, 1)
          hook.write_text(text)

          dialog = Path('src/components/offmarket/BriefVoorbereidenDialog.tsx')
          text = dialog.read_text()
          old = """        status,\n        kanaal,\n        campagne_stap: huidigeCampagneStap as any,\n"""
          new = """        status,\n        kanaal,\n        kanaal_wijzigen: !!briefId && initialBrief?.status !== 'verstuurd',\n        campagne_stap: huidigeCampagneStap as any,\n"""
          if old not in text: raise SystemExit('dialog upsert block not found')
          text = text.replace(old, new, 1)
          dialog.write_text(text)

          test = Path('src/test/offMarket/contactkanaalEmailSemantiek.test.ts')
          text = test.read_text()
          marker = "expect(bron).toContain(\"event_type: isEmail ? 'sent' : 'posted'\");"
          if marker not in text: raise SystemExit('test marker not found')
          text = text.replace(marker, marker + "\n    expect(bron).toContain('if (!input.kanaal_wijzigen) delete payload.kanaal;');", 1)
          test.write_text(text)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useOffMarketBrieven.tsx src/components/offmarket/BriefVoorbereidenDialog.tsx src/test/offMarket/contactkanaalEmailSemantiek.test.ts
          git commit -m "FIX contactkanaal upsert: behoud generiek updatecontract"
          git push origin HEAD:fix/contactkanaal-emailadres
