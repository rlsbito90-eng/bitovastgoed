name: Apply Pandenverkenner 1E.2 UX patch

on:
  push:
    branches:
      - feat/pandenverkenner-ux-1e2
    paths:
      - scripts/bag/apply-pandenverkenner-ux-1e2.mjs
      - .github/workflows/apply-pandenverkenner-ux-1e2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pandenverkenner-ux-1e2
          fetch-depth: 0
      - name: Pas UX-patch toe
        run: node scripts/bag/apply-pandenverkenner-ux-1e2.mjs
      - name: Verwijder eenmalige patchtooling
        run: rm scripts/bag/apply-pandenverkenner-ux-1e2.mjs .github/workflows/apply-pandenverkenner-ux-1e2.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(bag): herindeel Pandenverkenner UX 1E.2"
          git push origin HEAD:feat/pandenverkenner-ux-1e2
