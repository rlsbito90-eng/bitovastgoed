name: CRM Toegangslink Verify

on:
  push:
    branches:
      - fix/crm-access-without-passkey-20261115
    paths:
      - 'src/App.tsx'
      - 'src/pages/AuthPage.tsx'
      - '.github/workflows/crm-toegang-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-toegang-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-package-lock
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Authenticatie- en matchtests
        run: npx vitest run src/lib/auth src/lib/matching/rendementsOordeel.test.ts
      - name: Production build
        run: npm run build
