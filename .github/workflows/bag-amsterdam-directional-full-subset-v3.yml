name: BAG Amsterdam directionele full-subset v3

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Exact: GENERATE_BAG_AMSTERDAM_DIRECTIONAL_FULL_SUBSET_V3'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bag-amsterdam-directional-full-subset-v3
  cancel-in-progress: false

env:
  BAG_NL_SOURCE_URL: https://service.pdok.nl/kadaster/adressen/atom/v1_0/downloads/lvbag-extract-nl.zip
  SOURCE_RUN_ID: '31250980600'
  SELECTION_RUN_ID: '31260955867'
  SOURCE_PREFLIGHT_ARTIFACT_ID: '9020459804'
  SOURCE_PREFLIGHT_ARTIFACT_SHA256: e388fb14dd3fff908cf558cf873926d4a5049c304288b960780ef6a3fa7c5e43
  SELECTION_ARTIFACT_ID: '9022859486'
  SELECTION_ARTIFACT_SHA256: 7ee89022d425c0ce19ecad513b339ca23ff0991eb337c01bc20ff068371a1553
  EXPECTED_SOURCE_SHA256: 8f03782321490b113389df0bf215445bfa5c670b8f811bb7798ea8621c5b1007
  EXPECTED_SELECTION_CODE_COMMIT: 1386f21a2856e361a0f2334cd2d6dabab046ed8b
  PYTHONUNBUFFERED: '1'

jobs:
  generate:
    if: github.event.inputs.approval == 'GENERATE_BAG_AMSTERDAM_DIRECTIONAL_FULL_SUBSET_V3'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout gevalideerde repositorycode
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Valideer directionele extractielogica lokaal
        run: |
          set -euo pipefail
          python3 scripts/bag/test-select-amsterdam-from-metadata-v3.py
          python3 scripts/bag/test-extract-amsterdam-directional-full-subset-v3.py

      - name: Download exact gepinde bewijsartifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bag-amsterdam-v3/evidence/selection bag-amsterdam-v3/evidence/preflight
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SELECTION_ARTIFACT_ID}/zip" \
            > bag-amsterdam-v3/evidence/selection-artifact.zip
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_PREFLIGHT_ARTIFACT_ID}/zip" \
            > bag-amsterdam-v3/evidence/preflight-artifact.zip
          echo "${SELECTION_ARTIFACT_SHA256}  bag-amsterdam-v3/evidence/selection-artifact.zip" | sha256sum -c -
          echo "${SOURCE_PREFLIGHT_ARTIFACT_SHA256}  bag-amsterdam-v3/evidence/preflight-artifact.zip" | sha256sum -c -
          unzip -q bag-amsterdam-v3/evidence/selection-artifact.zip -d bag-amsterdam-v3/evidence/selection
          unzip -q bag-amsterdam-v3/evidence/preflight-artifact.zip -d bag-amsterdam-v3/evidence/preflight

      - name: Valideer provenance, scope en bronbewijs fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('bag-amsterdam-v3/evidence')
          selection = json.loads((root / 'selection/amsterdam-directionele-selectie-rapport.json').read_text())
          provenance = json.loads((root / 'selection/artifact-reuse-provenance.json').read_text())
          combined = json.loads((root / 'selection/gezamenlijk-stop-go-rapport.json').read_text())
          preflight = json.loads((root / 'preflight/preflight-rapport.json').read_text())

          expected_counts = {
              'Ligplaats': 3472,
              'Nummeraanduiding': 638604,
              'OpenbareRuimte': 7423,
              'Pand': 211112,
              'Standplaats': 511,
              'Verblijfsobject': 630005,
              'Woonplaats': 4,
          }
          expected_prefixes = {'0362': 27, '0363': 197752, '0424': 6, '0457': 13327}

          assert provenance['status'] == 'amsterdam_artifact_reuse_provenance'
          assert provenance['source_run_id'] == os.environ['SOURCE_RUN_ID']
          assert provenance['checked_out_code_commit'] == os.environ['EXPECTED_SELECTION_CODE_COMMIT']
          assert provenance['database_write_uitgevoerd'] is False
          assert provenance['supabase_benaderd'] is False
          assert provenance['productie_benaderd'] is False

          assert combined['status'] == 'amsterdam_metadata_artifacts_validated'
          assert combined['schema_version'] == 3
          assert combined['parse_fouten'] == 0
          assert combined['afwijkingen'] == []
          assert combined['database_write_uitgevoerd'] is False
          assert combined['supabase_benaderd'] is False
          assert combined['productie_benaderd'] is False

          assert selection['status'] == 'amsterdam_directionele_metadata_selectie_validated'
          assert selection['metadata_schema_version'] == 3
          assert selection['target_woonplaatsen'] == ['amsterdam', 'weesp']
          assert selection['ongeldige_metadatarecords'] == 0
          assert selection['geselecteerd_per_objecttype'] == expected_counts
          assert selection['pand_prefix_tellingen'] == expected_prefixes
          assert selection['onverwachte_pand_prefixes'] == {'0362': 27, '0424': 6}
          assert selection['database_write_uitgevoerd'] is False
          assert selection['supabase_benaderd'] is False
          assert selection['productie_benaderd'] is False

          assert preflight['status'] == 'amsterdam_bron_preflight_validated'
          assert preflight['metadata_schema_version'] == 3
          assert preflight['chunk_count'] == 8
          assert preflight['bron_sha256'] == os.environ['EXPECTED_SOURCE_SHA256']
          assert preflight['database_write_uitgevoerd'] is False
          assert preflight['supabase_benaderd'] is False
          assert preflight['productie_benaderd'] is False

          selection_file = root / 'selection/amsterdam-directionele-selectie.ndjson.gz'
          assert selection_file.is_file() and selection_file.stat().st_size > 0
          print('Gepinde Amsterdam/Weesp scope- en bronprovenance gevalideerd.')
          PY

      - name: Download exact bewezen officiële landelijke BAG-bron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bag-amsterdam-v3/source bag-amsterdam-v3/output
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 60 --max-time 10800 \
            "$BAG_NL_SOURCE_URL" \
            --output bag-amsterdam-v3/source/lvbag-extract-nl.zip
          unzip -t bag-amsterdam-v3/source/lvbag-extract-nl.zip
          echo "${EXPECTED_SOURCE_SHA256}  bag-amsterdam-v3/source/lvbag-extract-nl.zip" | sha256sum -c -

      - name: Extraheer uitsluitend exact geselecteerde objecttype-ID sleutels
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=2m 300m \
            python3 scripts/bag/extract-amsterdam-directional-full-subset-v3.py \
              bag-amsterdam-v3/source/lvbag-extract-nl.zip \
              bag-amsterdam-v3/evidence/selection/amsterdam-directionele-selectie.ndjson.gz \
              bag-amsterdam-v3/evidence/selection/amsterdam-directionele-selectie-rapport.json \
              bag-amsterdam-v3/output/full-subset-v3.ndjson \
              --verwachte-hash "$EXPECTED_SOURCE_SHA256"

      - name: Valideer full-subsetbewijs en maak compacte provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('bag-amsterdam-v3')
          proof_path = root / 'output/full-subset-v3.bewijs.json'
          proof = json.loads(proof_path.read_text()) if proof_path.exists() else {}
          workflow_proof = {
              'status': 'bag_amsterdam_directional_full_subset_workflow_evidence',
              'source_run_id': os.environ['SOURCE_RUN_ID'],
              'selection_run_id': os.environ['SELECTION_RUN_ID'],
              'source_preflight_artifact_id': os.environ['SOURCE_PREFLIGHT_ARTIFACT_ID'],
              'selection_artifact_id': os.environ['SELECTION_ARTIFACT_ID'],
              'expected_source_sha256': os.environ['EXPECTED_SOURCE_SHA256'],
              'full_subset_status': proof.get('status'),
              'full_subset_output_sha256': proof.get('output_sha256'),
              'database_write_uitgevoerd': False,
              'supabase_benaderd': False,
              'productie_benaderd': False,
          }
          (root / 'output/workflow-provenance.json').write_text(
              json.dumps(workflow_proof, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Verwijder landelijke bron vóór artifactpublicatie
        if: always()
        run: rm -f bag-amsterdam-v3/source/lvbag-extract-nl.zip

      - name: Comprimeer full-subset voor artifactopslag
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gzip -9 bag-amsterdam-v3/output/full-subset-v3.ndjson
          sha256sum bag-amsterdam-v3/output/full-subset-v3.ndjson.gz \
            > bag-amsterdam-v3/output/full-subset-v3.ndjson.gz.sha256

      - name: Publiceer directioneel full-subsetbewijs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bag-amsterdam-directional-full-subset-v3
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          path: |
            bag-amsterdam-v3/output/full-subset-v3.ndjson.gz
            bag-amsterdam-v3/output/full-subset-v3.ndjson.gz.sha256
            bag-amsterdam-v3/output/full-subset-v3.bewijs.json
            bag-amsterdam-v3/output/workflow-provenance.json
            bag-amsterdam-v3/evidence/selection/amsterdam-directionele-selectie-rapport.json
            bag-amsterdam-v3/evidence/selection/artifact-reuse-provenance.json
            bag-amsterdam-v3/evidence/preflight/preflight-rapport.json
