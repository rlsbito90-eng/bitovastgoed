name: CRM Inline Financieel & Objectstatus Verify
on:
  push:
    branches: [feat/object-inline-financien-status-20261118]
    paths:
      - 'src/components/object/ObjectCommercieelInline*'
      - 'src/components/object/ObjectStatusInline*'
      - 'src/components/pipeline/ObjectPipelineFaseSectie.tsx'
      - 'src/lib/objecten/inlineCommercieel*'
      - 'src/pages/ObjectDetailPage.tsx'
      - 'src/test/crmCompactCards.test.ts'
      - 'src/test/unifiedObjectLifecycleUx.test.ts'
      - '.github/workflows/crm-inline-financieel-status-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-inline-financieel-status-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-package-lock
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Financieel en lifecycle regressietests
        run: npx vitest run src/lib/objecten/inlineCommercieel.test.ts src/components/object/ObjectCommercieelInline.test.tsx src/components/object/ObjectStatusInline.test.tsx src/test/unifiedObjectLifecycleUx.test.ts src/test/crmCompactCards.test.ts src/test/object/objectContactenEnActies.test.ts src/test/object/objectCockpitOpvolging.test.ts src/test/derivations/financial.test.ts src/test/derivations/verhuur.test.ts src/test/vastgoedrekenen/saveGuards.test.ts
      - name: Productiebuild
        run: npm run build
