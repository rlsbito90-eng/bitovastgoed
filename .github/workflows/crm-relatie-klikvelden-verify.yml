name: CRM Relatievelden Klikwaarde Verify
on:
  push:
    branches: [feat/crm-relatie-velden-direct-aanklikbaar-20261118]
    paths:
      - 'src/components/relatie/InlineRelatieSectie*'
      - 'src/components/relatie/InlineRelatieClassificatie*'
      - 'src/components/relatie/InlineVastgoedVoorkeuren*'
      - '.github/workflows/crm-relatie-klikvelden-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-relatie-klikvelden-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-package-lock
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Relatievelden en classificatie
        run: npx vitest run src/components/relatie/InlineRelatieSectie.test.tsx src/components/relatie/InlineRelatieClassificatie.test.tsx src/components/relatie/InlineVastgoedVoorkeuren.test.tsx src/components/ui/editable-value-button.test.tsx src/test/crmTaxonomieDesign.test.ts src/components/forms/RelatieFormDialog.a13.test.tsx src/test/forms/quickCreateRelationDialog.test.tsx src/test/crmCompactCards.test.ts src/test/unifiedVisibleTrajectory.test.ts
      - name: Production build
        run: npm run build
