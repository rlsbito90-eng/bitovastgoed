name: Acquisitieproductiekern Databaseproef

on:
  push:
    branches:
      - feat/acquisitie-productiekern-build-a
    paths:
      - 'scripts/acquisitie/run-productiekern-database-proef.sh'
      - 'supabase/migration-drafts/20260806_acquisitie_productiekern_build_a.sql'
      - '.github/workflows/acquisitie-productiekern-database-proef.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-proef:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Geïsoleerde schema- en concurrencyproef
        run: bash scripts/acquisitie/run-productiekern-database-proef.sh
