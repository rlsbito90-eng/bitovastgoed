name: Apply reporting pipeline snapshot fix

on:
  push:
    branches:
      - fix/unified-visible-trajectory-phase

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-visible-trajectory-phase
          fetch-depth: 0
      - run: python scripts/fix_reporting_pipeline_snapshot.py
      - run: git diff --check
      - name: Commit result
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/RapportagePage.tsx src/test/unifiedVisibleTrajectory.test.ts
          git commit -m "fix: maak Object Pipeline rapportage een momentopname"
          git push origin HEAD:fix/unified-visible-trajectory-phase
