name: Temporary copy experiment patch

on:
  push:
    branches:
      - feat/acquisitie-copy-experimenten
    paths:
      - '.github/workflows/tmp-patch-copy-experimenten.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/acquisitie-copy-experimenten
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/tmp-patch-copy-experimenten.py
      - name: Remove temporary patcher
        run: rm scripts/tmp-patch-copy-experimenten.py .github/workflows/tmp-patch-copy-experimenten.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'BUILD acquisitie: activeer vaste copy-variantmeting'
          git push origin HEAD:feat/acquisitie-copy-experimenten
