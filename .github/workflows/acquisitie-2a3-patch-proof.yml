name: Acquisitie 2.0A.3 patch + DB proof

on:
  push:
    branches:
      - feat/acquisitie-workflow-2-0a3-polymorfe-selectie
    paths:
      - '.github/workflows/acquisitie-2a3-patch-proof.yml'

permissions:
  contents: write

jobs:
  patch-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/acquisitie-workflow-2-0a3-polymorfe-selectie
          fetch-depth: 0

      - name: PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply 2.0A.3 patch
        shell: bash
        run: |
          cat > supabase/migrations/20260812234500_acquisitie_selectie_vastgoedkansen.sql <<'EOF'
          -- BUILD 2.0A.3 — één Acquisitieselectie voor Off-Market-signalen en Vastgoedkansen.
          -- Bestaande signaalrecords blijven geldig; er wordt geen bronrecord aangemaakt of herschreven.

          ALTER TABLE public.off_market_acquisitie_selectie
            ADD COLUMN IF NOT EXISTS vastgoedkans_id uuid;

          ALTER TABLE public.off_market_acquisitie_selectie
            ALTER COLUMN signaal_id DROP NOT NULL;

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname = 'off_market_acquisitie_selectie_vastgoedkans_fk'
                AND conrelid = 'public.off_market_acquisitie_selectie'::regclass
            ) THEN
              ALTER TABLE public.off_market_acquisitie_selectie
                ADD CONSTRAINT off_market_acquisitie_selectie_vastgoedkans_fk
                FOREIGN KEY (vastgoedkans_id)
                REFERENCES public.vastgoedkansen(id)
                ON DELETE CASCADE
                NOT VALID;
            END IF;
          END $$;

          ALTER TABLE public.off_market_acquisitie_selectie
            VALIDATE CONSTRAINT off_market_acquisitie_selectie_vastgoedkans_fk;

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname = 'off_market_acquisitie_selectie_exact_een_bron'
                AND conrelid = 'public.off_market_acquisitie_selectie'::regclass
            ) THEN
              ALTER TABLE public.off_market_acquisitie_selectie
                ADD CONSTRAINT off_market_acquisitie_selectie_exact_een_bron
                CHECK (num_nonnulls(signaal_id, vastgoedkans_id) = 1)
                NOT VALID;
            END IF;
          END $$;

          ALTER TABLE public.off_market_acquisitie_selectie
            VALIDATE CONSTRAINT off_market_acquisitie_selectie_exact_een_bron;

          CREATE UNIQUE INDEX IF NOT EXISTS off_market_acquisitie_selectie_vastgoedkans_actief_uniek
            ON public.off_market_acquisitie_selectie (vastgoedkans_id)
            WHERE archived_at IS NULL AND vastgoedkans_id IS NOT NULL;

          CREATE INDEX IF NOT EXISTS off_market_acquisitie_selectie_vastgoedkans_idx
            ON public.off_market_acquisitie_selectie (vastgoedkans_id)
            WHERE vastgoedkans_id IS NOT NULL;
          EOF

          cat > src/components/offmarket/acquisitie/VastgoedkansenInAcquisitieSelectie.tsx <<'EOF'
          import { Archive, ExternalLink, X } from 'lucide-react';
          import { Link } from 'react-router-dom';
          import { toast } from 'sonner';
          import { Badge } from '@/components/ui/badge';
          import { Button } from '@/components/ui/button';
          import { useVastgoedkansen } from '@/hooks/useVastgoedkansen';
          import {
            type AcquisitieSelectieItem,
            useVerwijderVastgoedkansUitAcquisitieSelectie,
          } from '@/hooks/useAcquisitieSelectie';
          import { PRIORITEIT_LABEL, STATUS_LABEL, kansTitel } from '@/lib/vastgoedkansen';
          import { VASTGOEDKANS_STATUS_PRESENTATIE } from '@/lib/vastgoedkansStatusPresentation';

          interface Props {
            items: AcquisitieSelectieItem[];
          }

          export default function VastgoedkansenInAcquisitieSelectie({ items }: Props) {
            const { getKansById } = useVastgoedkansen();
            const verwijder = useVerwijderVastgoedkansUitAcquisitieSelectie();
            const kansItems = items.filter((item) => Boolean(item.vastgoedkans_id));

            if (kansItems.length === 0) return null;

            const verwijderUitSelectie = async (vastgoedkansId: string) => {
              try {
                await verwijder.mutateAsync(vastgoedkansId);
                toast.success('Vastgoedkans uit acquisitieselectie gehaald.');
              } catch (error) {
                toast.error(error instanceof Error ? error.message : 'Uit acquisitieselectie halen mislukt.');
              }
            };

            return (
              <section className="section-card overflow-hidden" data-testid="acquisitie-vastgoedkansen">
                <div className="flex flex-wrap items-center justify-between gap-2 border-b border-border/70 px-4 py-3">
                  <div>
                    <p className="text-sm font-medium">Vastgoedkansen</p>
                    <p className="text-xs text-muted-foreground">
                      {kansItems.length} vastgoedkans{kansItems.length === 1 ? '' : 'en'} in deze gedeelde acquisitieselectie
                    </p>
                  </div>
                  <Badge variant="outline">Gedeeld dossier</Badge>
                </div>
                <div className="divide-y divide-border/70">
                  {kansItems.map((item) => {
                    const kans = item.vastgoedkans_id ? getKansById(item.vastgoedkans_id) : undefined;
                    if (!kans) {
                      return (
                        <div key={item.id} className="flex items-center justify-between gap-3 px-4 py-3 text-sm">
                          <span className="text-muted-foreground">Vastgoedkans niet geladen ({item.vastgoedkans_id})</span>
                          {item.vastgoedkans_id && (
                            <Button size="sm" variant="ghost" onClick={() => void verwijderUitSelectie(item.vastgoedkans_id!)}>
                              <X className="mr-1.5 h-4 w-4" />Uit selectie
                            </Button>
                          )}
                        </div>
                      );
                    }
                    return (
                      <div key={item.id} className="flex flex-wrap items-start justify-between gap-3 px-4 py-3">
                        <div className="min-w-0 flex-1">
                          <div className="flex flex-wrap items-center gap-2">
                            <Link to={`/vastgoedkansen/${kans.id}`} className="break-words text-sm font-medium hover:text-primary hover:underline">
                              {kansTitel(kans)}
                            </Link>
                            <Badge variant="outline" className={VASTGOEDKANS_STATUS_PRESENTATIE[kans.status].chip}>
                              {STATUS_LABEL[kans.status]}
                            </Badge>
                            <Badge variant="outline">{PRIORITEIT_LABEL[kans.prioriteit] ?? `P${kans.prioriteit}`}</Badge>
                            {kans.archivedAt && <Badge variant="secondary"><Archive className="mr-1 h-3 w-3" />Gearchiveerd</Badge>}
                          </div>
                          <p className="mt-1 text-xs text-muted-foreground">
                            {[kans.adres, kans.postcode, kans.plaats].filter(Boolean).join(', ') || 'Adres ontbreekt'}
                            {kans.eigenaarNaam ? ` · Eigenaar: ${kans.eigenaarNaam}` : ''}
                          </p>
                        </div>
                        <div className="flex shrink-0 flex-wrap gap-2">
                          <Button asChild size="sm" variant="secondary">
                            <Link to={`/vastgoedkansen/${kans.id}`}><ExternalLink className="mr-1.5 h-3.5 w-3.5" />Open</Link>
                          </Button>
                          <Button
                            size="sm"
                            variant="ghost"
                            disabled={verwijder.isPending}
                            onClick={() => void verwijderUitSelectie(kans.id)}
                          >
                            <X className="mr-1.5 h-3.5 w-3.5" />Uit selectie
                          </Button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>
            );
          }
          EOF

          cat >> src/hooks/useAcquisitieSelectie.tsx <<'EOF'

          /** Set van Vastgoedkans-ids in de actieve gedeelde acquisitieselectie. */
          export function useActieveVastgoedkansSelectieIds(): Set<string> {
            const { data = [] } = useAcquisitieSelectie();
            return useMemo(
              () => new Set(data.map(r => r.vastgoedkans_id).filter((id): id is string => typeof id === 'string' && id.length > 0)),
              [data],
            );
          }

          /** Vastgoedkans toevoegen/heractiveren zonder een Off-Market-signaal te fabriceren. */
          export function useVoegVastgoedkansToeAanAcquisitieSelectie() {
            const qc = useQueryClient();
            return useMutation({
              mutationFn: async (vastgoedkansId: string): Promise<AcquisitieSelectieItem> => {
                const { data: u } = await supabase.auth.getUser();
                const door = u.user?.id ?? null;
                const { data: bestaand, error: leesFout } = await (supabase as any)
                  .from(TABLE)
                  .select('*')
                  .eq('vastgoedkans_id', vastgoedkansId)
                  .order('toegevoegd_op', { ascending: false })
                  .limit(1)
                  .maybeSingle();
                if (leesFout) throw new Error(leesFout.message);
                if (bestaand && bestaand.archived_at === null) return bestaand as AcquisitieSelectieItem;
                if (bestaand) {
                  const { data, error } = await (supabase as any)
                    .from(TABLE)
                    .update({ archived_at: null, toegevoegd_door: door, toegevoegd_op: new Date().toISOString() })
                    .eq('id', bestaand.id)
                    .select()
                    .single();
                  if (error) throw new Error(error.message);
                  return data as AcquisitieSelectieItem;
                }
                const { data, error } = await (supabase as any)
                  .from(TABLE)
                  .insert({ vastgoedkans_id: vastgoedkansId, signaal_id: null, toegevoegd_door: door })
                  .select()
                  .single();
                if (error) {
                  const { data: nu } = await (supabase as any)
                    .from(TABLE)
                    .select('*')
                    .eq('vastgoedkans_id', vastgoedkansId)
                    .is('archived_at', null)
                    .maybeSingle();
                  if (nu) return nu as AcquisitieSelectieItem;
                  throw new Error(error.message);
                }
                return data as AcquisitieSelectieItem;
              },
              onSuccess: () => invalidateAll(qc),
            });
          }

          /** Soft-remove van een Vastgoedkans uit dezelfde gedeelde selectie. */
          export function useVerwijderVastgoedkansUitAcquisitieSelectie() {
            const qc = useQueryClient();
            return useMutation({
              mutationFn: async (vastgoedkansId: string): Promise<{ vastgoedkans_id: string }> => {
                const { error } = await (supabase as any)
                  .from(TABLE)
                  .update({ archived_at: new Date().toISOString() })
                  .eq('vastgoedkans_id', vastgoedkansId)
                  .is('archived_at', null);
                if (error) throw new Error(error.message);
                return { vastgoedkans_id: vastgoedkansId };
              },
              onSuccess: () => invalidateAll(qc),
            });
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          # Hook: maak rij polymorf zonder bestaande signaal-API te breken.
          p = Path('src/hooks/useAcquisitieSelectie.tsx')
          s = p.read_text()
          s = s.replace('  signaal_id: string;\n', '  signaal_id: string | null;\n  vastgoedkans_id: string | null;\n', 1)
          s = s.replace('return useMemo(() => new Set(data.map(r => r.signaal_id)), [data]);', "return useMemo(() => new Set(data.map(r => r.signaal_id).filter((id): id is string => typeof id === 'string' && id.length > 0)), [data]);", 1)
          s = s.replace('() => data.filter((item) => !verzonden.has(item.signaal_id)).length,', "() => data.filter((item) => item.signaal_id === null || !verzonden.has(item.signaal_id)).length,", 1)
          p.write_text(s)

          # Vastgoedkansen: bulk naar acquisitieselectie.
          p = Path('src/pages/VastgoedkansenPage.tsx')
          s = p.read_text()
          old = "import { useVastgoedkansen } from '@/hooks/useVastgoedkansen';"
          new = old + "\nimport { useActieveVastgoedkansSelectieIds, useVoegVastgoedkansToeAanAcquisitieSelectie } from '@/hooks/useAcquisitieSelectie';"
          if old not in s: raise SystemExit('vastgoedkansen hook import anchor ontbreekt')
          s = s.replace(old, new, 1)
          old = "  const { kansen, archief, laden, archiveKansen, restoreKansen } = useVastgoedkansen();"
          new = old + "\n  const actieveAcquisitieIds = useActieveVastgoedkansSelectieIds();\n  const voegToeAanAcquisitie = useVoegVastgoedkansToeAanAcquisitieSelectie();"
          if old not in s: raise SystemExit('vastgoedkansen state anchor ontbreekt')
          s = s.replace(old, new, 1)
          anchor = "  const voerBulkActieUit = async () => {"
          fn = """  const voegSelectieToeAanAcquisitie = async () => {\n    const ids = [...geselecteerd];\n    const toeTeVoegen = ids.filter((id) => !actieveAcquisitieIds.has(id));\n    if (toeTeVoegen.length === 0) {\n      toast.info('Alle geselecteerde Vastgoedkansen staan al in de acquisitieselectie.');\n      return;\n    }\n    try {\n      for (const id of toeTeVoegen) await voegToeAanAcquisitie.mutateAsync(id);\n      toast.success(`${toeTeVoegen.length} Vastgoedkans${toeTeVoegen.length === 1 ? '' : 'en'} toegevoegd aan de acquisitieselectie.`);\n    } catch (error) {\n      toast.error(error instanceof Error ? error.message : 'Toevoegen aan acquisitieselectie mislukt.');\n    }\n  };\n\n"""
          if anchor not in s: raise SystemExit('bulk fn anchor ontbreekt')
          s = s.replace(anchor, fn + anchor, 1)
          old = "<div className=\"flex flex-wrap gap-2\">{werkbak === 'archief' ? <Button variant=\"outline\" disabled={geselecteerd.size === 0} onClick={() => setBevestigActie('heropenen')}><RotateCcw className=\"mr-1.5 h-4 w-4\" />Heropenen</Button> : <Button variant=\"outline\" disabled={geselecteerd.size === 0} onClick={() => setBevestigActie('archiveren')}><Archive className=\"mr-1.5 h-4 w-4\" />Archiveren</Button>}</div>"
          new = "<div className=\"flex flex-wrap gap-2\">{werkbak === 'archief' ? <Button variant=\"outline\" disabled={geselecteerd.size === 0} onClick={() => setBevestigActie('heropenen')}><RotateCcw className=\"mr-1.5 h-4 w-4\" />Heropenen</Button> : <><Button variant=\"secondary\" disabled={geselecteerd.size === 0 || voegToeAanAcquisitie.isPending} onClick={() => void voegSelectieToeAanAcquisitie()}>Naar acquisitieselectie</Button><Button variant=\"outline\" disabled={geselecteerd.size === 0} onClick={() => setBevestigActie('archiveren')}><Archive className=\"mr-1.5 h-4 w-4\" />Archiveren</Button></>}</div>"
          if old not in s: raise SystemExit('bulk toolbar anchor ontbreekt')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Acquisitieselectie: filter nullable signaal_id en toon Vastgoedkansen expliciet.
          p = Path('src/components/offmarket/acquisitie/AcquisitieSelectieTab.tsx')
          s = p.read_text()
          old = "import AcquisitieDossierRij from './AcquisitieDossierRij';"
          new = old + "\nimport VastgoedkansenInAcquisitieSelectie from './VastgoedkansenInAcquisitieSelectie';"
          if old not in s: raise SystemExit('acq component import anchor ontbreekt')
          s = s.replace(old, new, 1)
          s = s.replace("    return lijst\n      .map(it => signaalIndex.get(it.signaal_id))", "    return lijst\n      .filter(it => typeof it.signaal_id === 'string' && it.signaal_id.length > 0)\n      .map(it => signaalIndex.get(it.signaal_id!))", 1)
          s = s.replace("    for (const it of items) m.set(it.signaal_id, it.toegevoegd_op ?? null);", "    for (const it of items) if (it.signaal_id) m.set(it.signaal_id, it.toegevoegd_op ?? null);", 1)
          old = "  if (geselecteerdeSignalen.length === 0) {"
          new = "  const heeftVastgoedkansen = items.some((item) => Boolean(item.vastgoedkans_id));\n\n  if (geselecteerdeSignalen.length === 0 && !heeftVastgoedkansen) {"
          if old not in s: raise SystemExit('empty anchor ontbreekt')
          s = s.replace(old, new, 1)
          # Als alleen Vastgoedkansen geselecteerd zijn: geen lege Off-Market-toolbar tonen.
          marker = "  const geselecteerdeSignalenBulk = Array.from(bulkSelectie)"
          block = """  if (geselecteerdeSignalen.length === 0 && heeftVastgoedkansen) {\n    return (\n      <section className=\"space-y-3\" data-testid=\"acquisitie-selectie-tab\">\n        <VastgoedkansenInAcquisitieSelectie items={items} />\n      </section>\n    );\n  }\n\n"""
          if marker not in s: raise SystemExit('bulk marker ontbreekt')
          s = s.replace(marker, block + marker, 1)
          # Toon VK-sectie boven bestaande Off-Market-werkbakken als beide bronnen bestaan.
          old = "      <AcquisitieKpis kpis={readiness.kpis} />"
          new = "      <VastgoedkansenInAcquisitieSelectie items={items} />\n      <AcquisitieKpis kpis={readiness.kpis} />"
          if old not in s: raise SystemExit('kpi anchor ontbreekt')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          cat > src/lib/offMarket/acquisitie/polymorfeSelectieMigratie.test.ts <<'EOF'
          import fs from 'node:fs';
          import { describe, expect, it } from 'vitest';

          const sql = fs.readFileSync('supabase/migrations/20260812234500_acquisitie_selectie_vastgoedkansen.sql', 'utf8');

          describe('BUILD 2.0A.3 — polymorfe acquisitieselectie', () => {
            it('breidt het legacy contract uit zonder signaalrecords te herschrijven', () => {
              expect(sql).toContain('ADD COLUMN IF NOT EXISTS vastgoedkans_id uuid');
              expect(sql).toContain('ALTER COLUMN signaal_id DROP NOT NULL');
              expect(sql).toContain('num_nonnulls(signaal_id, vastgoedkans_id) = 1');
              expect(sql).toContain('REFERENCES public.vastgoedkansen(id)');
              expect(sql).toContain('off_market_acquisitie_selectie_vastgoedkans_actief_uniek');
              expect(sql).not.toMatch(/UPDATE\s+public\.off_market_acquisitie_selectie/i);
              expect(sql).not.toMatch(/INSERT\s+INTO\s+public\.off_market_signalen/i);
            });
          });
          EOF

      - name: Geïsoleerde legacy + polymorfe databaseproef
        shell: bash
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE TABLE public.off_market_signalen (id uuid PRIMARY KEY);
          CREATE TABLE public.vastgoedkansen (id uuid PRIMARY KEY);
          CREATE TABLE public.off_market_acquisitie_selectie (
            id uuid PRIMARY KEY,
            signaal_id uuid NOT NULL REFERENCES public.off_market_signalen(id) ON DELETE CASCADE,
            toegevoegd_door uuid REFERENCES auth.users(id) ON DELETE SET NULL,
            toegevoegd_op timestamptz NOT NULL DEFAULT now(),
            notitie text,
            archived_at timestamptz
          );
          CREATE UNIQUE INDEX off_market_acquisitie_selectie_actief_uniek
            ON public.off_market_acquisitie_selectie(signaal_id) WHERE archived_at IS NULL;
          CREATE INDEX off_market_acquisitie_selectie_signaal_idx
            ON public.off_market_acquisitie_selectie(signaal_id);

          INSERT INTO auth.users VALUES ('00000000-0000-0000-0000-000000000001');
          INSERT INTO public.off_market_signalen VALUES ('10000000-0000-0000-0000-000000000001');
          INSERT INTO public.vastgoedkansen VALUES
            ('20000000-0000-0000-0000-000000000001'),
            ('20000000-0000-0000-0000-000000000002');
          INSERT INTO public.off_market_acquisitie_selectie(id, signaal_id, toegevoegd_door)
          VALUES ('30000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000001');
          SQL

          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260812234500_acquisitie_selectie_vastgoedkansen.sql

          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE legacy_count integer;
          BEGIN
            SELECT count(*) INTO legacy_count
            FROM public.off_market_acquisitie_selectie
            WHERE signaal_id = '10000000-0000-0000-0000-000000000001'
              AND vastgoedkans_id IS NULL
              AND archived_at IS NULL;
            IF legacy_count <> 1 THEN RAISE EXCEPTION 'legacy record niet behouden'; END IF;
          END $$;

          INSERT INTO public.off_market_acquisitie_selectie(id, signaal_id, vastgoedkans_id)
          VALUES ('30000000-0000-0000-0000-000000000002', NULL, '20000000-0000-0000-0000-000000000001');

          DO $$
          BEGIN
            BEGIN
              INSERT INTO public.off_market_acquisitie_selectie(id, signaal_id, vastgoedkans_id)
              VALUES ('30000000-0000-0000-0000-000000000003', NULL, NULL);
              RAISE EXCEPTION 'lege bron werd ten onrechte geaccepteerd';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            BEGIN
              INSERT INTO public.off_market_acquisitie_selectie(id, signaal_id, vastgoedkans_id)
              VALUES ('30000000-0000-0000-0000-000000000004', '10000000-0000-0000-0000-000000000001', '20000000-0000-0000-0000-000000000002');
              RAISE EXCEPTION 'dubbele bron werd ten onrechte geaccepteerd';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            BEGIN
              INSERT INTO public.off_market_acquisitie_selectie(id, signaal_id, vastgoedkans_id)
              VALUES ('30000000-0000-0000-0000-000000000005', NULL, '20000000-0000-0000-0000-000000000001');
              RAISE EXCEPTION 'dubbele actieve Vastgoedkans werd ten onrechte geaccepteerd';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
          END $$;

          UPDATE public.off_market_acquisitie_selectie
          SET archived_at = now()
          WHERE vastgoedkans_id = '20000000-0000-0000-0000-000000000001';

          INSERT INTO public.off_market_acquisitie_selectie(id, signaal_id, vastgoedkans_id)
          VALUES ('30000000-0000-0000-0000-000000000006', NULL, '20000000-0000-0000-0000-000000000001');
          SQL

      - name: Commit final branch without patch workflow
        shell: bash
        run: |
          git rm .github/workflows/acquisitie-2a3-patch-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260812234500_acquisitie_selectie_vastgoedkansen.sql \
                  src/hooks/useAcquisitieSelectie.tsx \
                  src/pages/VastgoedkansenPage.tsx \
                  src/components/offmarket/acquisitie/AcquisitieSelectieTab.tsx \
                  src/components/offmarket/acquisitie/VastgoedkansenInAcquisitieSelectie.tsx \
                  src/lib/offMarket/acquisitie/polymorfeSelectieMigratie.test.ts
          git commit -m "BUILD 2.0A.3: maak acquisitieselectie polymorf voor Vastgoedkansen"
          git push origin HEAD:feat/acquisitie-workflow-2-0a3-polymorfe-selectie
