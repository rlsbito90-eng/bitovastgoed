name: Probe CBS Amsterdam staging coverage

on:
  push:
    branches:
      - probe/cbs-amsterdam-staging-coverage-1d2

permissions:
  actions: read
  contents: read

concurrency:
  group: cbs-amsterdam-staging-coverage-1d2
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: bag-shadow
    env:
      BAG_SHADOW_DATABASE_URL: ${{ secrets.BAG_SHADOW_DATABASE_URL }}
      BAG_SHADOW_PROJECT_REF: xfygspvpeugxowxbcvnm
      CBS_ARTIFACT_ID: '9126107462'
      CBS_BRONJAAR: '2025'
      CBS_GEMEENTECODE: GM0363
      BAG_SCOPE_CODE: '0363'
      INDEX_BUILD_ID: '3'
      BUURTEN_SHA256: bd5cd7fdc1d1f23a7b6ae2bf36e309872c1b7ab8243d127fbc989e3b869c77e0
      WIJKEN_SHA256: b76c1ffa4a606994184fcf45462cae4127d0acb43802965f987d37994a82a725

    steps:
      - uses: actions/checkout@v4

      - name: Harde preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$BAG_SHADOW_PROJECT_REF" = 'xfygspvpeugxowxbcvnm'
          test "$BAG_SHADOW_PROJECT_REF" != 'ljudxyrqoifhfikueric'
          test "$BAG_SHADOW_PROJECT_REF" != 'wzkhmjuasyuvzhhycnym'
          test "$CBS_ARTIFACT_ID" = '9126107462'
          test "$CBS_BRONJAAR" = '2025'
          test "$CBS_GEMEENTECODE" = 'GM0363'
          test "$BAG_SCOPE_CODE" = '0363'
          test "$INDEX_BUILD_ID" = '3'
          test -n "$BAG_SHADOW_DATABASE_URL"
          command -v psql
          command -v gh
          command -v python3

          psql "$BAG_SHADOW_DATABASE_URL" -v ON_ERROR_STOP=1 -F $'\t' -A -t <<'SQL' > preflight.tsv
          select 'build_status', status from bag_search.index_builds where id=3 and scope_code='0363';
          select 'index_rows', count(*) from bag_search.pand_search_index where index_build_id=3 and scope_code='0363';
          select 'live_wijk_filled', count(*) from bag_search.pand_search_index where index_build_id=3 and scope_code='0363' and wijk_code is not null;
          select 'live_buurt_filled', count(*) from bag_search.pand_search_index where index_build_id=3 and scope_code='0363' and buurt_code is not null;
          select 'staging_buurten_before', count(*) from bag_search.cbs_buurten_staging;
          select 'staging_wijken_before', count(*) from bag_search.cbs_wijken_staging;
          SQL
          cat preflight.tsv
          grep -qx $'build_status\tactief' preflight.tsv
          grep -qx $'index_rows\t211112' preflight.tsv
          grep -qx $'live_wijk_filled\t0' preflight.tsv
          grep -qx $'live_buurt_filled\t0' preflight.tsv

      - name: Download exact gevalideerd CBS-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cbs-source
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CBS_ARTIFACT_ID}/zip" \
            > cbs-source/artifact.zip
          unzip -q cbs-source/artifact.zip -d cbs-source/unpacked
          test -s cbs-source/unpacked/report.json
          test -s cbs-source/unpacked/amsterdam-buurten-2025.geojson
          test -s cbs-source/unpacked/amsterdam-wijken-2025.geojson
          echo "$BUURTEN_SHA256  cbs-source/unpacked/amsterdam-buurten-2025.geojson" | sha256sum -c -
          echo "$WIJKEN_SHA256  cbs-source/unpacked/amsterdam-wijken-2025.geojson" | sha256sum -c -
          grep -q 'CBS_AMSTERDAM_SOURCE_OK' cbs-source/unpacked/report.json

      - name: Maak begrensde staging-TSV's
        shell: python
        run: |
          import csv, json, pathlib, re
          root = pathlib.Path('cbs-source/unpacked')

          def load(name):
              return json.loads((root / name).read_text(encoding='utf-8'))['features']

          buurten = load('amsterdam-buurten-2025.geojson')
          wijken = load('amsterdam-wijken-2025.geojson')
          if len(buurten) != 519 or len(wijken) != 111:
              raise SystemExit(f'onverwachte aantallen: buurten={len(buurten)} wijken={len(wijken)}')

          with open('buurten.tsv','w',encoding='utf-8',newline='') as fh:
              w=csv.writer(fh,delimiter='\t',quoting=csv.QUOTE_MINIMAL)
              w.writerow(['bronjaar','gemeentecode','buurtcode','buurtnaam','wijkcode','geom_json','bron_sha256'])
              for f in buurten:
                  p=f['properties']; code=p['buurtcode']; wijk='WK'+code[2:8]
                  if p['jaar'] != 2025 or p['gemeentecode'] != 'GM0363' or not re.fullmatch(r'BU0363[A-Z0-9]{4}',code):
                      raise SystemExit(f'ongeldige buurt {code}')
                  w.writerow([2025,'GM0363',code,p['buurtnaam'],wijk,json.dumps(f['geometry'],separators=(',',':')),'bd5cd7fdc1d1f23a7b6ae2bf36e309872c1b7ab8243d127fbc989e3b869c77e0'])

          with open('wijken.tsv','w',encoding='utf-8',newline='') as fh:
              w=csv.writer(fh,delimiter='\t',quoting=csv.QUOTE_MINIMAL)
              w.writerow(['bronjaar','gemeentecode','wijkcode','wijknaam','geom_json','bron_sha256'])
              for f in wijken:
                  p=f['properties']; code=p['wijkcode']
                  if p['jaar'] != 2025 or p['gemeentecode'] != 'GM0363' or not re.fullmatch(r'WK0363[A-Z0-9]{2}',code):
                      raise SystemExit(f'ongeldige wijk {code}')
                  w.writerow([2025,'GM0363',code,p['wijknaam'],json.dumps(f['geometry'],separators=(',',':')),'b76c1ffa4a606994184fcf45462cae4127d0acb43802965f987d37994a82a725'])

      - name: Laad uitsluitend CBS-staging en valideer
        shell: bash
        run: |
          set -euo pipefail
          psql "$BAG_SHADOW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          truncate table bag_search.cbs_buurten_staging, bag_search.cbs_wijken_staging;

          create temp table raw_buurten (
            bronjaar integer, gemeentecode text, buurtcode text, buurtnaam text,
            wijkcode text, geom_json text, bron_sha256 text
          ) on commit drop;
          create temp table raw_wijken (
            bronjaar integer, gemeentecode text, wijkcode text, wijknaam text,
            geom_json text, bron_sha256 text
          ) on commit drop;

          \copy raw_buurten from 'buurten.tsv' with (format csv, delimiter E'\t', header true, quote '"');
          \copy raw_wijken from 'wijken.tsv' with (format csv, delimiter E'\t', header true, quote '"');

          insert into bag_search.cbs_buurten_staging
            (bronjaar,gemeentecode,buurtcode,buurtnaam,wijkcode,geometrie,bron_sha256)
          select bronjaar,gemeentecode,buurtcode,buurtnaam,wijkcode,
            st_multi(st_transform(st_setsrid(st_force2d(st_geomfromgeojson(geom_json)),4326),28992))::geometry(MultiPolygon,28992),
            bron_sha256
          from raw_buurten;

          insert into bag_search.cbs_wijken_staging
            (bronjaar,gemeentecode,wijkcode,wijknaam,geometrie,bron_sha256)
          select bronjaar,gemeentecode,wijkcode,wijknaam,
            st_multi(st_transform(st_setsrid(st_force2d(st_geomfromgeojson(geom_json)),4326),28992))::geometry(MultiPolygon,28992),
            bron_sha256
          from raw_wijken;

          do $$
          begin
            if (select count(*) from bag_search.cbs_buurten_staging) <> 519 then raise exception 'buurtaantal ongeldig'; end if;
            if (select count(*) from bag_search.cbs_wijken_staging) <> 111 then raise exception 'wijkaantal ongeldig'; end if;
            if exists(select 1 from bag_search.cbs_buurten_staging where not st_isvalid(geometrie) or st_srid(geometrie)<>28992) then raise exception 'ongeldige buurtgeometrie'; end if;
            if exists(select 1 from bag_search.cbs_wijken_staging where not st_isvalid(geometrie) or st_srid(geometrie)<>28992) then raise exception 'ongeldige wijkgeometrie'; end if;
            if exists(select 1 from bag_search.cbs_buurten_staging b left join bag_search.cbs_wijken_staging w using(wijkcode) where w.wijkcode is null) then raise exception 'buurt zonder wijk'; end if;
          end $$;
          commit;
          SQL

      - name: Meet centroid-dekking zonder live update
        shell: bash
        run: |
          set -euo pipefail
          psql "$BAG_SHADOW_DATABASE_URL" -v ON_ERROR_STOP=1 -F $'\t' -A -P footer=off <<'SQL' > coverage.tsv
          with matches as (
            select i.pand_identificatie, count(b.buurtcode)::integer as match_count
            from bag_search.pand_search_index i
            left join bag_search.cbs_buurten_staging b
              on st_covers(b.geometrie, i.centroid)
            where i.index_build_id=3 and i.scope_code='0363'
            group by i.pand_identificatie
          )
          select
            count(*) as totaal_panden,
            count(*) filter(where match_count=0) as nul_matches,
            count(*) filter(where match_count=1) as enkele_match,
            count(*) filter(where match_count>1) as meervoudige_matches,
            max(match_count) as max_matches
          from matches;

          select 'staging_buurten' as controle, count(*)::text as waarde from bag_search.cbs_buurten_staging
          union all select 'staging_wijken', count(*)::text from bag_search.cbs_wijken_staging
          union all select 'live_wijk_filled', count(*)::text from bag_search.pand_search_index where index_build_id=3 and scope_code='0363' and wijk_code is not null
          union all select 'live_buurt_filled', count(*)::text from bag_search.pand_search_index where index_build_id=3 and scope_code='0363' and buurt_code is not null;
          SQL
          cat coverage.tsv
          grep -q $'^211112\t' coverage.tsv
          grep -qx $'staging_buurten\t519' coverage.tsv
          grep -qx $'staging_wijken\t111' coverage.tsv
          grep -qx $'live_wijk_filled\t0' coverage.tsv
          grep -qx $'live_buurt_filled\t0' coverage.tsv

      - name: Upload staging coverage proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbs-amsterdam-staging-coverage-1d2
          path: |
            preflight.tsv
            coverage.tsv
            cbs-source/unpacked/report.json
          if-no-files-found: warn
          retention-days: 14
