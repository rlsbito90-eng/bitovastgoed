name: Apply contextuele integriteit en objectmatching

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/contextuele-integriteit-objectmatching'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply BUILD A2.1 + B2 + B3
        run: node scripts/apply-contextuele-integriteit-objectmatching.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Remove temporary automation
        run: |
          rm scripts/apply-contextuele-integriteit-objectmatching.mjs
          rm .github/workflows/apply-contextuele-integriteit-objectmatching.yml
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: make integrity contextual and add read-only object matching"
            git push origin HEAD:${{ github.head_ref }}
          fi
