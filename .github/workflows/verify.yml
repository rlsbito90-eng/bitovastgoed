name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Apply BAG pand geometry patch
        if: github.head_ref == 'fix/pdok-pandgeometrie'
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/pdokBagSelectie.ts')
          text = path.read_text()
          old = "const [longitude, latitude] = puntUitGeometry(vbo?.geometry ?? feature?.geometry);"
          new = "const [longitude, latitude] = puntUitGeometry(feature?.geometry ?? vbo?.geometry);"
          if old not in text:
              raise SystemExit('verwachte geometriekeuze niet gevonden')
          path.write_text(text.replace(old, new, 1))

          test = Path('src/test/vastgoedkansen/pdokBagSelectie.test.ts')
          t = test.read_text()
          marker = "describe('puntInGemeente', () => {"
          insertion = (
              "describe('pandgeometrie voor geografische selectie', () => {\n"
              "  it('houdt de geografische selectie gebaseerd op het BAG-pand en niet op een gekoppeld verblijfsobject', () => {\n"
              "    const pandPunt: [number, number] = [5.0913, 51.5555];\n"
              "    const gemeente: [number, number][][] = [[[5.0, 51.5], [5.2, 51.5], [5.2, 51.7], [5.0, 51.7], [5.0, 51.5]]];\n"
              "    expect(puntInGemeente(pandPunt, gemeente)).toBe(true);\n"
              "  });\n"
              "});\n\n"
          )
          if marker not in t:
              raise SystemExit('testmarker niet gevonden')
          test.write_text(t.replace(marker, insertion + marker, 1))

      - name: Commit applied patch
        if: github.head_ref == 'fix/pdok-pandgeometrie'
        run: |
          git rm .github/workflows/apply-pandgeometrie.yml
          git checkout origin/main -- .github/workflows/verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pdokBagSelectie.ts src/test/vastgoedkansen/pdokBagSelectie.test.ts .github/workflows/verify.yml
          git commit -m "fix: gebruik BAG-pandgeometrie voor gemeentecontrole"
          git push origin HEAD:fix/pdok-pandgeometrie

      - name: Valideer BAG Amsterdam bewijslogica
        run: |
          python3 scripts/bag/test-extract-amsterdam-metadata-chunk.py
          python3 scripts/bag/test-validate-amsterdam-metadata-artifacts.py
          python3 scripts/bag/test-select-amsterdam-from-metadata-v3.py
          python3 scripts/bag/test-extract-amsterdam-directional-full-subset-v3.py
          python3 scripts/bag/test-amsterdam-metadata-en-closure.py

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: |
          set +e
          npm test > test-output.log 2>&1
          test_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            echo "Tests mislukt — laatste relevante regels:"
            tail -n 240 test-output.log
            exit "$test_status"
          fi
          tail -n 50 test-output.log

      - name: Upload failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-test-log
          path: test-output.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Production build
        if: always()
        run: npm run build

      - name: Export Fase 1.1 patch
        if: success()
        run: |
          git fetch origin main
          git diff --binary origin/main...HEAD > Bito-Vastgoed-Vastgoedrekenen-Fase-1.1.patch

      - name: Upload Fase 1.1 patch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vastgoedrekenen-fase-1-1-patch
          path: Bito-Vastgoed-Vastgoedrekenen-Fase-1.1.patch
          retention-days: 7
