name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Apply strategy-aware validation UX
        id: patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed = False

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              global changed
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Patchdoel niet gevonden: {label}')
              changed = True
              return text.replace(old, new, 1)

          # 1. Strategie- en actiebewuste validatie.
          path = Path('src/lib/vastgoedrekenen/validation.ts')
          source = path.read_text()
          source = replace_once(
              source,
              "import { isWoonComponentType } from './defaults';",
              "import { isWoonComponentType } from './defaults';\nimport { getEffectiveWwsMode } from './wws/mode';",
              'validation import WWS mode',
          )
          source = replace_once(
              source,
              "export type ValidationAction = {\n  label: string;\n  sectionId: string;\n  targetId?: string;\n};",
              "export type ValidationAction = {\n  label: string;\n  sectionId: string;\n  targetId?: string;\n  /** Open het aangewezen tabelitem/drawer na navigatie. */\n  openTarget?: boolean;\n};",
              'ValidationAction openTarget',
          )
          source = replace_once(
              source,
              "export type ValidationItem = {\n  level: 'warning' | 'info' | 'blocker';\n  title?: string;\n  message: string;\n  actions?: ValidationAction[];\n};",
              "export type ValidationItem = {\n  level: 'warning' | 'info' | 'blocker';\n  /** Nu oplossen, later dossiermatig controleren, of bewust niet relevant. */\n  category?: 'now' | 'later' | 'not_relevant';\n  title?: string;\n  message: string;\n  actions?: ValidationAction[];\n};",
              'ValidationItem category',
          )
          source = replace_once(
              source,
              "  const wooncomponenten = components.filter((x) => isWoonComponentType(x.component_type));\n  if (wooncomponenten.length > 0 && wwsUnits.length === 0) {\n    out.push({ level: 'warning', message: `Er zijn ${wooncomponenten.length} wooncomponent(en) maar nog geen WWS-units. Klik \"Maak WWS-units uit wooncomponenten\" of markeer WWS als niet relevant.` });\n  }\n\n  // --- WWS-units: ontbrekende kerngegevens ---\n  if (wwsUnits.length > 0) {",
              "  const wooncomponenten = components.filter((x) => isWoonComponentType(x.component_type));\n  const effectiveWwsMode = getEffectiveWwsMode(null, {\n    scenario, components, strategyUnits: sellOffUnits, wwsUnits,\n  });\n  const wwsRelevant = effectiveWwsMode.mode !== 'niet_nodig';\n  if (wooncomponenten.length > 0 && wwsUnits.length === 0 && wwsRelevant) {\n    out.push({\n      level: 'warning',\n      category: 'now',\n      title: 'WWS-keuze afronden',\n      message: `Er zijn ${wooncomponenten.length} wooncomponent(en), maar nog geen WWS-units. Maak WWS-units aan wanneer WWS relevant is, of kies bewust \"Niet nodig\" voor dit scenario.`,\n      actions: [{ label: 'Open WWS-keuze', sectionId: 'sec-wws' }],\n    });\n  } else if (wooncomponenten.length > 0 && !wwsRelevant) {\n    out.push({\n      level: 'info',\n      category: 'not_relevant',\n      title: 'WWS niet relevant',\n      message: `WWS is voor dit scenario handmatig op \"Niet nodig\" gezet. De ${wooncomponenten.length} wooncomponent(en) hoeven daarom geen WWS-units te krijgen zolang de gekozen strategie of huurbron niet verandert.`,\n      actions: [{ label: 'Open WWS-keuze', sectionId: 'sec-wws' }],\n    });\n  }\n\n  // --- WWS-units: ontbrekende kerngegevens ---\n  if (wwsRelevant && wwsUnits.length > 0) {",
              'WWS validatie respecteert niet nodig',
          )
          source = replace_once(
              source,
              "  if (objectType === 'mixed_use' && scenario.ovb_mode !== 'per_component') {\n    out.push({ level: 'warning', message: 'Biedingsrisico: mixed-use object zonder OVB-toerekening per component. Verschillende tarieven kunnen de maximale koopsom materieel beïnvloeden.' });\n  }\n\n  if (scenario.ovb_mode === 'per_component') {\n    const zonderWaarde = components.filter((x) => !x.allocated_component_value && !x.surface_gbo);\n    if (zonderWaarde.length > 0) {\n      out.push({ level: 'blocker', message: `${zonderWaarde.length} component(en) zonder componentwaarde of m². OVB per component kan niet correct worden berekend.` });\n    }\n  }",
              "  if (objectType === 'mixed_use' && scenario.ovb_mode !== 'per_component') {\n    out.push({\n      level: 'warning',\n      category: 'now',\n      title: 'OVB-verdeling kiezen',\n      message: 'Dit mixed-use object gebruikt nog geen OVB-toerekening per component. Omdat woningen en niet-woningen verschillend kunnen worden behandeld, kan dit de investering en maximale aankoopprijs materieel beïnvloeden.',\n      actions: [\n        { label: 'Kies OVB-modus', sectionId: 'sec-aankoop' },\n        { label: 'Bekijk componenten', sectionId: 'sec-componenten' },\n      ],\n    });\n  }\n\n  if (scenario.ovb_mode === 'per_component') {\n    const zonderWaarde = components.filter((x) => !x.allocated_component_value && !x.surface_gbo);\n    if (zonderWaarde.length > 0) {\n      out.push({\n        level: 'blocker',\n        category: 'now',\n        title: 'OVB per component aanvullen',\n        message: `${zonderWaarde.length} component(en) hebben nog geen toegerekende waarde of bruikbare m²-grondslag. Open het eerste component en kies daar de OVB-classificatie en toerekeningsmethode.`,\n        actions: [{\n          label: 'Open eerste onvolledige component',\n          sectionId: 'sec-componenten',\n          targetId: `componenten-unit-${zonderWaarde[0].id}`,\n          openTarget: true,\n        }],\n      });\n    }\n  }",
              'OVB validatie met acties',
          )
          source = replace_once(
              source,
              "        {\n          label: 'Naar componentkosten',\n          sectionId: 'sec-strategie',\n          targetId: `strategy-unit-${detail.componentUnitIds[0]}`,\n        },",
              "        {\n          label: 'Naar componentkosten',\n          sectionId: 'sec-strategie',\n          targetId: `strategy-unit-${detail.componentUnitIds[0]}`,\n          openTarget: true,\n        },",
              'open component strategy drawer',
          )
          source = replace_once(
              source,
              "  if (scenario.assumptions_manual && !scenario.assumptions_source) {\n    out.push({ level: 'warning', message: 'Aannames zijn handmatig aangepast zonder onderbouwing. Leg de bron vast.' });\n  }",
              "  if (scenario.assumptions_manual && !scenario.assumptions_source) {\n    out.push({\n      level: 'warning',\n      category: 'now',\n      title: 'Bron van handmatige aannames vastleggen',\n      message: 'Aannames zijn handmatig aangepast zonder onderbouwing. Leg vast waar de aangepaste percentages of bedragen vandaan komen.',\n      actions: [{ label: 'Open onderbouwing', sectionId: 'sec-onderbouwing' }],\n    });\n  }",
              'manual assumptions action',
          )
          path.write_text(source)

          # 2. Rustige, gegroepeerde actielijst.
          path = Path('src/components/vastgoedrekenen/NogTeControleren.tsx')
          next_source = '''import { AlertTriangle, Info, Ban, ArrowRight } from 'lucide-react';
import type { ValidationAction, ValidationItem } from '@/lib/vastgoedrekenen/validation';

type ValidationCategory = NonNullable<ValidationItem['category']>;

function categoryOf(item: ValidationItem): ValidationCategory {
  return item.category ?? (item.level === 'info' ? 'later' : 'now');
}

function ItemList({
  items,
  onAction,
}: {
  items: ValidationItem[];
  onAction?: (action: ValidationAction) => void;
}) {
  return (
    <ol className="space-y-2">
      {items.map((item, idx) => {
        const Icon = item.level === 'blocker' ? Ban : item.level === 'warning' ? AlertTriangle : Info;
        const color = item.level === 'blocker'
          ? 'text-destructive'
          : item.level === 'warning'
            ? 'text-amber-800 dark:text-amber-200'
            : 'text-muted-foreground';
        return (
          <li key={`${item.title ?? item.message}-${idx}`} className="rounded-md border bg-background/80 p-2.5">
            <div className={`flex gap-2 text-xs ${color}`}>
              <span className="flex h-5 w-5 shrink-0 items-center justify-center rounded-full border font-semibold text-[10px]">{idx + 1}</span>
              <Icon className="h-3.5 w-3.5 mt-0.5 flex-shrink-0" />
              <span className="min-w-0">
                {item.title && <span className="block font-semibold text-foreground">{item.title}</span>}
                <span className="block mt-0.5 leading-relaxed">{item.message}</span>
              </span>
            </div>
            {item.actions && item.actions.length > 0 && (
              <div className="mt-2 ml-12 flex flex-wrap gap-2">
                {item.actions.map((action) => (
                  <button
                    key={`${action.sectionId}-${action.targetId ?? ''}-${action.label}`}
                    type="button"
                    onClick={() => onAction?.(action)}
                    className="inline-flex items-center gap-1 rounded-md border bg-card px-2.5 py-1.5 text-[11px] font-medium text-foreground hover:bg-muted"
                  >
                    {action.label}<ArrowRight className="h-3 w-3" />
                  </button>
                ))}
              </div>
            )}
          </li>
        );
      })}
    </ol>
  );
}

export default function NogTeControleren({
  items,
  title = 'Beslisstatus en acties',
  onAction,
}: {
  items: ValidationItem[];
  title?: string;
  onAction?: (action: ValidationAction) => void;
}) {
  if (items.length === 0) return null;

  const now = items.filter((item) => categoryOf(item) === 'now');
  const later = items.filter((item) => categoryOf(item) === 'later');
  const notRelevant = items.filter((item) => categoryOf(item) === 'not_relevant');

  return (
    <div className="rounded-lg border bg-card p-3 space-y-3">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div>
          <p className="text-sm font-semibold text-foreground">{title}</p>
          <p className="text-[11px] text-muted-foreground">Alleen punten onder “Nu nodig” beïnvloeden de actuele werkstroom.</p>
        </div>
        <div className="flex flex-wrap gap-1.5 text-[10px]">
          <span className="rounded-full border border-amber-500/40 bg-amber-500/10 px-2 py-1 text-amber-800 dark:text-amber-200">{now.length} nu</span>
          <span className="rounded-full border bg-muted/50 px-2 py-1 text-muted-foreground">{later.length} later</span>
          {notRelevant.length > 0 && <span className="rounded-full border bg-muted/30 px-2 py-1 text-muted-foreground">{notRelevant.length} niet relevant</span>}
        </div>
      </div>

      {now.length > 0 ? (
        <section className="rounded-md border border-amber-500/30 bg-amber-500/5 p-3 space-y-2">
          <div>
            <p className="text-xs font-semibold text-amber-900 dark:text-amber-200">Nu nodig</p>
            <p className="text-[10px] text-muted-foreground">Aanpassen of controleren voor een betrouwbaardere actuele uitkomst.</p>
          </div>
          <ItemList items={now} onAction={onAction} />
        </section>
      ) : (
        <div className="rounded-md border border-emerald-500/30 bg-emerald-500/5 px-3 py-2 text-xs text-emerald-800 dark:text-emerald-200">
          Geen directe herstelactie voor de huidige strategie en invoer.
        </div>
      )}

      {later.length > 0 && (
        <details className="rounded-md border bg-muted/20">
          <summary className="cursor-pointer list-none px-3 py-2 text-xs font-medium text-foreground">
            Later controleren <span className="text-muted-foreground font-normal">({later.length})</span>
          </summary>
          <div className="border-t p-3">
            <p className="mb-2 text-[10px] text-muted-foreground">Dossier- en transactiekwaliteit; niet allemaal leidend voor de actuele berekening.</p>
            <ItemList items={later} onAction={onAction} />
          </div>
        </details>
      )}

      {notRelevant.length > 0 && (
        <details className="rounded-md border bg-muted/10">
          <summary className="cursor-pointer list-none px-3 py-2 text-xs font-medium text-muted-foreground">
            Niet relevant voor dit scenario ({notRelevant.length})
          </summary>
          <div className="border-t p-3">
            <ItemList items={notRelevant} onAction={onAction} />
          </div>
        </details>
      )}
    </div>
  );
}
'''
          if path.read_text() != next_source:
              path.write_text(next_source)
              changed = True

          # 3. Scenario-editor: drawer openen, WWS-status consequent en tellingen opschonen.
          path = Path('src/components/vastgoedrekenen/ScenarioEditor.tsx')
          source = path.read_text()
          source = replace_once(
              source,
              "      target.scrollIntoView({ behavior: 'smooth', block: 'center' });\n      target.classList.add('ring-2', 'ring-amber-500', 'ring-offset-2', 'ring-offset-background');\n      const focusable = target.querySelector<HTMLElement>('input, [role=combobox], textarea, button');\n      window.setTimeout(() => focusable?.focus({ preventScroll: true }), 250);",
              "      target.scrollIntoView({ behavior: 'smooth', block: 'center' });\n      target.classList.add('ring-2', 'ring-amber-500', 'ring-offset-2', 'ring-offset-background');\n      if (action.openTarget) {\n        window.setTimeout(() => target.click(), 180);\n      }\n      const focusable = target.querySelector<HTMLElement>('input, [role=combobox], textarea, button');\n      window.setTimeout(() => focusable?.focus({ preventScroll: true }), 250);",
              'validation action opens target',
          )
          source = replace_once(
              source,
              '          title="Acties om dit scenario te verbeteren"',
              '          title="Beslisstatus en acties"',
              'validation panel title',
          )
          source = replace_once(
              source,
              "        const hasResidential = wwsUnits.length > 0\n          || components.some((c) => c.component_type === 'woning' || c.component_type === 'appartement')\n          || propertyType === 'residentieel' || propertyType === 'mixed_use';\n        \n",
              "        const hasResidential = wwsUnits.length > 0\n          || components.some((c) => c.component_type === 'woning' || c.component_type === 'appartement')\n          || propertyType === 'residentieel' || propertyType === 'mixed_use';\n        const scenarioWwsMode = getEffectiveWwsMode(null, {\n          scenario: s, components, strategyUnits: sellOffUnits, wwsUnits,\n        });\n        const wwsRelevantForScenario = scenarioWwsMode.mode !== 'niet_nodig';\n        \n",
              'scenario WWS mode for presentation',
          )
          source = replace_once(
              source,
              "        const blockerCount = nogTeControleren.filter((i) => i.level === 'blocker').length;\n        const warningCount = nogTeControleren.filter((i) => i.level === 'warning').length;",
              "        const blockerCount = nogTeControleren.filter((i) => i.level === 'blocker').length;\n        const warningCount = nogTeControleren.filter((i) => i.level === 'warning').length;\n        const validationCategory = (item: (typeof nogTeControleren)[number]) => item.category ?? (item.level === 'info' ? 'later' : 'now');\n        const nowCount = nogTeControleren.filter((item) => validationCategory(item) === 'now').length;\n        const laterCount = nogTeControleren.filter((item) => validationCategory(item) === 'later').length;",
              'validation category counts',
          )
          source = replace_once(
              source,
              "        const wwsHasWarnings = wwsUnits.length > 0 && (() => {\n          // Tel units waarvan WWS-status indicatief/incompleet is.\n          let warn = 0;\n          for (const u of wwsUnits) {\n            const st = getWwsUnitStatus(u as unknown as WwsUnit);\n            if (st.reliability !== 'volledig') warn++;\n          }\n          return warn;\n        })();\n        const wwsRelevance: SectionRelevance =\n          (hasResidential || wwsUnits.length > 0)\n            ? (wwsHasWarnings ? 'aandacht' : 'informatief')\n            : 'niet_relevant';",
              "        const wwsHasWarnings = wwsRelevantForScenario && wwsUnits.length > 0 ? (() => {\n          // Tel units waarvan WWS-status indicatief/incompleet is, maar alleen als WWS relevant is.\n          let warn = 0;\n          for (const u of wwsUnits) {\n            const st = getWwsUnitStatus(u as unknown as WwsUnit);\n            if (st.reliability !== 'volledig') warn++;\n          }\n          return warn;\n        })() : 0;\n        const wwsRelevance: SectionRelevance = !wwsRelevantForScenario\n          ? 'niet_relevant'\n          : (hasResidential || wwsUnits.length > 0)\n            ? (wwsHasWarnings ? 'aandacht' : 'informatief')\n            : 'niet_relevant';",
              'WWS rail relevance',
          )
          source = replace_once(
              source,
              "        const onderbouwingStatus = `${nogTeControleren.length} aandachtspunt(en) · betrouwbaarheid ${outputs.inputReliability}`;",
              "        const onderbouwingStatus = `${nowCount} nu · ${laterCount} later · betrouwbaarheid ${outputs.inputReliability}`;",
              'underbouwing status grouped',
          )
          source = replace_once(
              source,
              "        const wwsStatus = wwsUnits.length === 0\n          ? 'Geen woonunits'\n          : `${wwsUnits.length} woonunit(s)${wwsHasWarnings ? ` · ${wwsHasWarnings} indicatief/onvolledig` : ' · volledig'}`;",
              "        const wwsStatus = !wwsRelevantForScenario\n          ? 'Niet nodig — gekozen voor dit scenario'\n          : wwsUnits.length === 0\n            ? 'Geen WWS-units'\n            : `${wwsUnits.length} woonunit(s)${wwsHasWarnings ? ` · ${wwsHasWarnings} indicatief/onvolledig` : ' · volledig'}`;",
              'WWS status text',
          )
          source = replace_once(
              source,
              "          'sec-onderbouwing': { status: relToRailStatus(undefined, blockerCount > 0, warningCount > 0), count: nogTeControleren.length, hint: onderbouwingStatus },",
              "          'sec-onderbouwing': { status: relToRailStatus(undefined, blockerCount > 0, warningCount > 0), count: nowCount + laterCount, hint: onderbouwingStatus },",
              'underbouwing rail count',
          )
          path.write_text(source)

          # 4. Regressietests voor WWS/OVB en de nieuwe groepering.
          path = Path('src/test/vastgoedrekenen/actionableValidation.test.ts')
          source = path.read_text()
          marker = "\n});\n"
          addition = r'''

  it('respecteert de handmatige keuze WWS niet nodig', () => {
    const scenario = context().scenario as ValidationContext['scenario'] & { wws_mode_default?: string | null };
    scenario.wws_mode_default = 'niet_nodig';
    const result = buildNogTeControleren(context({ scenario }));

    expect(result.some((entry) => entry.message.includes('nog geen WWS-units'))).toBe(false);
    const notRelevant = result.find((entry) => entry.title === 'WWS niet relevant');
    expect(notRelevant?.category).toBe('not_relevant');
    expect(notRelevant?.actions?.[0]?.sectionId).toBe('sec-wws');
  });

  it('maakt de mixed-use OVB-waarschuwing direct navigeerbaar', () => {
    const scenario = context().scenario;
    scenario.ovb_mode = 'auto';
    const result = buildNogTeControleren(context({ scenario, objectType: 'mixed_use' }));

    const item = result.find((entry) => entry.title === 'OVB-verdeling kiezen');
    expect(item?.category).toBe('now');
    expect(item?.actions?.map((action) => action.sectionId)).toEqual(['sec-aankoop', 'sec-componenten']);
  });

  it('opent bij onvolledige OVB het eerste betreffende component', () => {
    const scenario = context().scenario;
    scenario.ovb_mode = 'per_component';
    const result = buildNogTeControleren(context({
      scenario,
      objectType: 'mixed_use',
      components: [comp({ id: 'component-ovb', component_type: 'appartement', allocated_component_value: null, surface_gbo: null })],
    }));

    const item = result.find((entry) => entry.title === 'OVB per component aanvullen');
    expect(item?.actions?.[0]).toMatchObject({
      targetId: 'componenten-unit-component-ovb',
      openTarget: true,
    });
  });
'''
          if "respecteert de handmatige keuze WWS niet nodig" not in source:
              pos = source.rfind(marker)
              if pos < 0:
                  raise SystemExit('Testslot actionableValidation niet gevonden')
              source = source[:pos] + addition + source[pos:]
              path.write_text(source)
              changed = True

          path = Path('src/test/ui/actionableValidationUx.test.ts')
          source = path.read_text()
          addition = r'''

  it('groepeert herstelacties en respecteert niet-relevante WWS', () => {
    const list = source('src/components/vastgoedrekenen/NogTeControleren.tsx');
    const editor = source('src/components/vastgoedrekenen/ScenarioEditor.tsx');
    expect(list).toContain('Nu nodig');
