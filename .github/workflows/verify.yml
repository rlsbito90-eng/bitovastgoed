name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Apply CRS84 consistency patch
        if: github.head_ref == 'fix/pdok-crs84-consistentie'
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/lib/pdokBagSelectie.ts')
          text = path.read_text()
          text = text.replace(
            "const PAGINA_LIMIET = 100;",
            "const PAGINA_LIMIET = 100;\nconst CRS84 = 'http://www.opengis.net/def/crs/OGC/1.3/CRS84';"
          )

          marker = "function puntUitGeometry(geometry: any): [number | null, number | null] {\n"
          replacement = """export function isGeldigeNederlandseCrs84Punt(value: unknown): value is Punt {
  if (!Array.isArray(value) || value.length < 2) return false;
  const longitude = Number(value[0]);
  const latitude = Number(value[1]);
  return Number.isFinite(longitude)
    && Number.isFinite(latitude)
    && longitude >= 2.5
    && longitude <= 7.8
    && latitude >= 50.5
    && latitude <= 54.0;
}

function puntUitGeometry(geometry: any): [number | null, number | null] {
"""
          if marker not in text:
            raise SystemExit('puntUitGeometry marker niet gevonden')
          text = text.replace(marker, replacement, 1)

          old_point = """  const x = coordinates.reduce((sum, point) => sum + point[0], 0) / coordinates.length;
  const y = coordinates.reduce((sum, point) => sum + point[1], 0) / coordinates.length;
  return [x, y];
}"""
          new_point = """  const x = coordinates.reduce((sum, point) => sum + point[0], 0) / coordinates.length;
  const y = coordinates.reduce((sum, point) => sum + point[1], 0) / coordinates.length;
  return isGeldigeNederlandseCrs84Punt([x, y]) ? [x, y] : [null, null];
}"""
          if old_point not in text:
            raise SystemExit('puntUitGeometry body niet gevonden')
          text = text.replace(old_point, new_point, 1)

          text = text.replace(
            "const params = new URLSearchParams({ limit: '500', f: 'json' });",
            "const params = new URLSearchParams({ limit: '500', f: 'json', crs: CRS84 });",
            1,
          )

          old_vbo = "try { vbo = await fetchJson(`${href}${href.includes('?') ? '&' : '?'}f=json`); } catch { return null; }"
          new_vbo = "try {\n    const separator = href.includes('?') ? '&' : '?';\n    vbo = await fetchJson(`${href}${separator}f=json&crs=${encodeURIComponent(CRS84)}`);\n  } catch { return null; }"
          if old_vbo not in text:
            raise SystemExit('VBO fetch niet gevonden')
          text = text.replace(old_vbo, new_vbo, 1)

          old_bag_params = "const eersteParams = new URLSearchParams({ bbox: gebied.bbox.join(','), limit: String(PAGINA_LIMIET), f: 'json' });"
          new_bag_params = "const eersteParams = new URLSearchParams({\n    bbox: gebied.bbox.join(','),\n    'bbox-crs': CRS84,\n    crs: CRS84,\n    limit: String(PAGINA_LIMIET),\n    f: 'json',\n  });"
          if old_bag_params not in text:
            raise SystemExit('BAG params niet gevonden')
          text = text.replace(old_bag_params, new_bag_params, 1)

          old_boundary = """  const ringen = ringenUitGeometrie(exact.geometry);
  const bbox = bboxUitGeometrie(exact.geometry) ?? bboxUitGeometrie(exact.bbox);
  if (!bbox || !ringen.length) throw new Error(`Voor gemeente “${gemeente}” kon geen officiële gemeentegrens worden bepaald.`);

  return { bbox, ringen, naam: gemeentenaamUitFeature(exact) ?? opgeschoond };"""
          new_boundary = """  const ringen = ringenUitGeometrie(exact.geometry);
  const bbox = bboxUitGeometrie(exact.geometry) ?? bboxUitGeometrie(exact.bbox);
  const allePunten = ringen.flat();
  if (!bbox || !ringen.length || !allePunten.every(isGeldigeNederlandseCrs84Punt)) {
    throw new Error(`Voor gemeente “${gemeente}” kon geen geldige CRS84-gemeentegrens worden bepaald.`);
  }

  return { bbox, ringen, naam: gemeentenaamUitFeature(exact) ?? opgeschoond };"""
          if old_boundary not in text:
            raise SystemExit('gemeentegrens validatie niet gevonden')
          path.write_text(text.replace(old_boundary, new_boundary, 1))

          test = Path('src/test/vastgoedkansen/pdokBagSelectie.test.ts')
          t = test.read_text()
          t = t.replace(
            "import { bboxUitGeometrie, puntInGemeente, zelfdeGemeente } from '@/lib/pdokBagSelectie';",
            "import { bboxUitGeometrie, isGeldigeNederlandseCrs84Punt, puntInGemeente, zelfdeGemeente } from '@/lib/pdokBagSelectie';"
          )
          marker_test = "describe('puntInGemeente', () => {"
          insertion = """describe('CRS84-validatie', () => {
  it('accepteert Nederlandse longitude/latitude', () => {
    expect(isGeldigeNederlandseCrs84Punt([4.9041, 52.3676])).toBe(true);
    expect(isGeldigeNederlandseCrs84Punt([5.0913, 51.5555])).toBe(true);
  });

  it('weigert RD-coördinaten en omgedraaide assen', () => {
    expect(isGeldigeNederlandseCrs84Punt([121000, 487000])).toBe(false);
    expect(isGeldigeNederlandseCrs84Punt([52.3676, 4.9041])).toBe(false);
  });
});

"""
          if marker_test not in t:
            raise SystemExit('testmarker niet gevonden')
          test.write_text(t.replace(marker_test, insertion + marker_test, 1))

      - name: Commit applied patch
        if: github.head_ref == 'fix/pdok-crs84-consistentie'
        run: |
          git rm .github/workflows/apply-pdok-crs84-fix.yml
          git checkout origin/main -- .github/workflows/verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pdokBagSelectie.ts src/test/vastgoedkansen/pdokBagSelectie.test.ts .github/workflows/verify.yml
          git commit -m "fix: forceer CRS84 in PDOK BAG-selectie"
          git push origin HEAD:fix/pdok-crs84-consistentie

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: |
          set +e
          npm test > test-output.log 2>&1
          test_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            echo "Tests mislukt — laatste relevante regels:"
            tail -n 240 test-output.log
            exit "$test_status"
          fi
          tail -n 50 test-output.log

      - name: Upload failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-test-log
          path: test-output.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Production build
        if: always()
        run: npm run build

      - name: Export Fase 1.1 patch
        if: success()
        run: |
          git fetch origin main --depth=1
          git diff --binary origin/main...HEAD > Bito-Vastgoed-Vastgoedrekenen-Fase-1.1.patch

      - name: Upload Fase 1.1 patch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vastgoedrekenen-fase-1-1-patch
          path: Bito-Vastgoed-Vastgoedrekenen-Fase-1.1.patch
          retention-days: 7
