name: Apply Pandenverkenner Map v2
on:
  push:
    branches:
      - feat/pandenverkenner-map-v2
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pandenverkenner-map-v2
      - run: node scripts/dev/apply-pandenverkenner-map-v2.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/bag/queryService.ts src/lib/bag/queryTransport.ts supabase/functions/bag-query-service/index.ts src/lib/bag/kaartModel.ts src/lib/bag/kaartSession.ts src/components/bag/BagPandenKaart.tsx
          git commit -m "feat(bag): implementeer Map v2 client en transport"
          git push origin HEAD:feat/pandenverkenner-map-v2
