name: Apply Vastgoedrekenen navigation and comparison fix

on:
  push:
    branches:
      - feat/vastgoedrekenen-fase-1-1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: activate vastgoedrekenen navigation comparison fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/vastgoedrekenen-fase-1-1
          fetch-depth: 0

      - name: Apply targeted acceptance patch
        run: python3 scripts/apply_vastgoedrekenen_navigation_comparison_fix.py

      - name: Commit corrected application code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "fix: quickscan navigation and development comparison"
          git push origin HEAD:feat/vastgoedrekenen-fase-1-1
