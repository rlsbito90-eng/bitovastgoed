} from './progression';

const offer = (patch: Partial<Bieding> = {}): Bieding => ({
  id: 'b1', objectId: 'o1', relatieId: 'r1', bedrag: 600000,
  currency: 'EUR', bieddatum: '2026-09-01', status: 'ontvangen',
