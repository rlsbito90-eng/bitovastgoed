name: Apply bid flow codemod

on:
  push:
    branches:
      - feat/bid-flow-auto-progress
    paths:
      - scripts/codemod_bid_flow.py

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bid-flow-auto-progress
          fetch-depth: 0
      - name: Apply guarded CRM changes
        run: python scripts/codemod_bid_flow.py
      - name: Commit codemod result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "CRM: biedingsreeks en veilige pipeline-automatisering"
          git push origin HEAD:feat/bid-flow-auto-progress
