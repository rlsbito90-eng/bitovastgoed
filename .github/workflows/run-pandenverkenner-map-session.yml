name: Apply Pandenverkenner map session
on:
  push:
    branches:
      - feat/pandenverkenner-workflow-persistence-v3
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pandenverkenner-workflow-persistence-v3
      - run: node scripts/dev/apply-pandenverkenner-map-session.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/bag/BagPandenKaart.tsx
          git commit -m "feat(bag): herstel kaartgebied en kaartresultaten binnen sessie"
          git push origin HEAD:feat/pandenverkenner-workflow-persistence-v3
