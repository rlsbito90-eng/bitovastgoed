name: Apply Pandenverkenner 1D.4 patch

on:
  push:
    branches:
      - feat/pandenverkenner-wijk-buurt-ui-1d4
    paths:
      - scripts/bag/apply-pandenverkenner-1d4-patch.mjs
      - .github/workflows/apply-pandenverkenner-1d4-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pandenverkenner-wijk-buurt-ui-1d4
          fetch-depth: 0
      - name: Pas bronpatch toe
        run: node scripts/bag/apply-pandenverkenner-1d4-patch.mjs
      - name: Verwijder eenmalige patchtooling
        run: |
          git rm scripts/bag/apply-pandenverkenner-1d4-patch.mjs
          git rm .github/workflows/apply-pandenverkenner-1d4-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/bag/BagServicePandenlijst.tsx supabase/functions/bag-query-service/index.ts
          git commit -m "feat(bag): koppel wijk en buurt aan Pandenverkenner 1D.4"
          git push origin HEAD:feat/pandenverkenner-wijk-buurt-ui-1d4
