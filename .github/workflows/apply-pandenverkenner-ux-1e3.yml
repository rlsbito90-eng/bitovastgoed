name: Apply Pandenverkenner 1E.3 UX patch
on:
  push:
    branches: [feat/pandenverkenner-ux-1e3]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pandenverkenner-ux-1e3
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/bag/BagPandenKaart.tsx')
          s = p.read_text()
          s = s.replace("import { Loader2, MapPinned, RefreshCw } from 'lucide-react';", "import { Check, Copy, ExternalLink, Loader2, MapPinned, RefreshCw } from 'lucide-react';")
          s = s.replace("import { Button } from '@/components/ui/button';", "import { Button } from '@/components/ui/button';\nimport { bouwGoogleMapsAdresUrl } from '@/lib/bag/googleMaps';\nimport type { BagVerkennerPand } from '@/lib/bag/pandenverkennerModel';")
          s = s.replace("interface Props {\n  scopeCode: string;\n  filters: BagKaartFilters;\n}", "interface Props {\n  scopeCode: string;\n  filters: BagKaartFilters;\n  geselecteerdeIds?: Set<string>;\n  onKandidaatToggle?: (pand: BagVerkennerPand) => void;\n}\n\nfunction kaartRijNaarVerkennerPand(row: BagKaartPandRij): BagVerkennerPand {\n  const adres = row.primair_adres?.trim() || row.identificatie;\n  return {\n    datasetversieId: String(row.datasetversie_id),\n    bagPandId: row.identificatie,\n    voorkomenSleutel: '',\n    status: row.status,\n    adres,\n    adresCompleet: Boolean(row.primair_adres?.trim()),\n    straat: null,\n    postcode: row.primair_postcode?.trim() || null,\n    plaats: row.primair_plaats?.trim() || null,\n    wijkCode: row.wijk_code?.trim() || null,\n    wijkNaam: row.wijk_naam?.trim() || null,\n    buurtCode: row.buurt_code?.trim() || null,\n    buurtNaam: row.buurt_naam?.trim() || null,\n    bouwjaar: Number.isFinite(row.bouwjaar) ? row.bouwjaar : null,\n    gebruiksdoelen: row.gebruiksdoelen ?? [],\n    oppervlakte: row.vbo_oppervlakte_som == null ? null : Number(row.vbo_oppervlakte_som),\n    aantalVerblijfsobjecten: Number.isFinite(row.vbo_aantal) ? Number(row.vbo_aantal) : 0,\n    gemengdGebruik: Boolean(row.is_gemengd),\n    cursor: '',\n  };\n}")
          s = s.replace("export default function BagPandenKaart({ scopeCode, filters }: Props) {", "export default function BagPandenKaart({ scopeCode, filters, geselecteerdeIds = new Set(), onKandidaatToggle }: Props) {")
          anchor = "  const geselecteerdPunt = useMemo(() => {\n    if (!geselecteerd) return null;\n    const feature = geojson.features.find(item => item.properties.id === geselecteerd.id);\n    return feature?.geometry.coordinates as [number, number] | undefined;\n  }, [geojson.features, geselecteerd]);"
          insert = anchor + "\n\n  const geselecteerdRij = useMemo(() => rows.find(row => row.identificatie === geselecteerd?.id) ?? null, [rows, geselecteerd]);\n  const kandidaatGeselecteerd = geselecteerd ? geselecteerdeIds.has(geselecteerd.id) : false;\n\n  const kopieerBagId = async () => {\n    if (!geselecteerd) return;\n    try {\n      await navigator.clipboard.writeText(geselecteerd.id);\n      toast.success('BAG-ID gekopieerd.');\n    } catch {\n      toast.error('BAG-ID kopiëren mislukt.');\n    }\n  };"
          s = s.replace(anchor, insert)
          old_popup = """              <div className=\"min-w-[220px] p-1 text-xs text-foreground\">\n                <p className=\"text-sm font-semibold\">{geselecteerd.adres}</p>\n                <p className=\"mt-1 text-muted-foreground\">{[geselecteerd.postcode, geselecteerd.plaats].filter(Boolean).join(' ')}</p>\n                <div className=\"mt-2 space-y-1 text-muted-foreground\">\n                  {geselecteerd.status && <p>{geselecteerd.status}</p>}\n                  {geselecteerd.bouwjaar !== null && <p>Bouwjaar {geselecteerd.bouwjaar}</p>}\n                  {geselecteerd.gbo !== null && <p>{formatGetal(geselecteerd.gbo, ' m² GBO')}</p>}\n                  {geselecteerd.vboAantal !== null && <p>{formatGetal(geselecteerd.vboAantal, ' VBO')}</p>}\n                  {geselecteerd.wijk && <p>Wijk: {geselecteerd.wijk}</p>}\n                  {geselecteerd.buurt && <p>Buurt: {geselecteerd.buurt}</p>}\n                </div>\n                <p className=\"mt-2 font-mono text-[10px] text-muted-foreground\">BAG-pand {geselecteerd.id}</p>\n              </div>"""
          new_popup = """              <div className=\"min-w-[240px] p-1 text-sm text-foreground\">\n                <div className=\"flex items-start justify-between gap-2\">\n                  <div>\n                    <p className=\"font-semibold leading-tight\">{geselecteerd.adres}</p>\n                    <p className=\"mt-1 text-xs text-muted-foreground\">{[geselecteerd.postcode, geselecteerd.plaats].filter(Boolean).join(' ')}</p>\n                  </div>\n                  {kandidaatGeselecteerd && <Badge variant=\"secondary\" className=\"shrink-0 text-[10px]\">Geselecteerd</Badge>}\n                </div>\n                <div className=\"mt-3 grid grid-cols-2 gap-x-3 gap-y-1 text-xs text-muted-foreground\">\n                  {geselecteerd.status && <p className=\"col-span-2\">{geselecteerd.status}</p>}\n                  {geselecteerd.bouwjaar !== null && <p>Bouwjaar {geselecteerd.bouwjaar}</p>}\n                  {geselecteerd.gbo !== null && <p>{formatGetal(geselecteerd.gbo, ' m² GBO')}</p>}\n                  {geselecteerd.vboAantal !== null && <p>{formatGetal(geselecteerd.vboAantal, ' VBO')}</p>}\n                  {geselecteerd.wijk && <p className=\"col-span-2\">Wijk: {geselecteerd.wijk}</p>}\n                  {geselecteerd.buurt && <p className=\"col-span-2\">Buurt: {geselecteerd.buurt}</p>}\n                </div>\n                <div className=\"mt-3 grid gap-2\">\n                  {geselecteerdRij && onKandidaatToggle && (\n                    <Button size=\"sm\" variant={kandidaatGeselecteerd ? 'secondary' : 'default'} className=\"w-full justify-center text-xs\" onClick={() => onKandidaatToggle(kaartRijNaarVerkennerPand(geselecteerdRij))}>\n                      <Check className=\"mr-1.5 h-3.5 w-3.5\" />{kandidaatGeselecteerd ? 'Deselecteer kandidaat' : 'Selecteer kandidaat'}\n                    </Button>\n                  )}\n                  <div className=\"grid grid-cols-2 gap-2\">\n                    <Button asChild size=\"sm\" variant=\"outline\" className=\"text-xs\">\n                      <a href={bouwGoogleMapsAdresUrl({ adres: geselecteerd.adres, postcode: geselecteerd.postcode || null, plaats: geselecteerd.plaats || null })} target=\"_blank\" rel=\"noreferrer\"><ExternalLink className=\"mr-1.5 h-3.5 w-3.5\" />Google Maps</a>\n                    </Button>\n                    <Button size=\"sm\" variant=\"outline\" className=\"text-xs\" onClick={() => void kopieerBagId()}><Copy className=\"mr-1.5 h-3.5 w-3.5\" />BAG-ID</Button>\n                  </div>\n                </div>\n                <p className=\"mt-3 truncate font-mono-data text-[10px] text-muted-foreground\" title={`BAG-pand ${geselecteerd.id}`}>BAG-pand {geselecteerd.id}</p>\n              </div>"""
          if old_popup not in s: raise SystemExit('popup anchor not found')
          s = s.replace(old_popup, new_popup)
          p.write_text(s)

          p = Path('src/components/bag/BagServicePandenlijst.tsx')
          s = p.read_text()
          s = s.replace("  const [toonMeerFilters, setToonMeerFilters] = useState(false);", "  const [toonMeerFilters, setToonMeerFilters] = useState(false);\n  const [kaartKandidaten, setKaartKandidaten] = useState<Map<string, BagVerkennerPand>>(new Map());")
          s = s.replace("    setGeselecteerd(new Set());\n    setPreflight(null);\n  }, [serverFilters, filters.gebruiksdoelen, filters.alleenGemengd]);", "    setGeselecteerd(new Set());\n    setKaartKandidaten(new Map());\n    setPreflight(null);\n  }, [serverFilters, filters.gebruiksdoelen, filters.alleenGemengd]);")
          s = s.replace("  const panden = useMemo(() => paginas.flat(), [paginas]);", "  const panden = useMemo(() => paginas.flat(), [paginas]);\n  const selectiePanden = useMemo(() => {\n    const uniek = new Map(panden.map(pand => [pand.bagPandId, pand]));\n    kaartKandidaten.forEach((pand, id) => uniek.set(id, pand));\n    return [...uniek.values()];\n  }, [panden, kaartKandidaten]);")
          anchor = "  const togglePand = (pand: BagVerkennerPand) => {"
          addition = """  const toggleKaartKandidaat = (pand: BagVerkennerPand) => {\n    const blokkade = blokkadeVoorPand(pand, context);\n    if (blokkade) {\n      toast.error(REDEN_LABEL[blokkade]);\n      return;\n    }\n    setPreflight(null);\n    setKaartKandidaten(previous => {\n      const next = new Map(previous);\n      if (geselecteerd.has(pand.bagPandId)) next.delete(pand.bagPandId);\n      else next.set(pand.bagPandId, pand);\n      return next;\n    });\n    setGeselecteerd(previous => {\n      const next = new Set(previous);\n      if (next.has(pand.bagPandId)) next.delete(pand.bagPandId);\n      else if (next.size < 250) next.add(pand.bagPandId);\n      else toast.error('Selecteer maximaal 250 panden per preflight.');\n      return next;\n    });\n  };\n\n""" + anchor
          s = s.replace(anchor, addition)
          s = s.replace("setPreflight(beoordeelBagSelectie(panden, geselecteerd, context))", "setPreflight(beoordeelBagSelectie(selectiePanden, geselecteerd, context))")
          s = s.replace("    {weergave === 'kaart' && <BagPandenKaart scopeCode={scopeCode} filters={kaartFilters} />}", "    {weergave === 'kaart' && <>\n      <BagPandenKaart scopeCode={scopeCode} filters={kaartFilters} geselecteerdeIds={geselecteerd} onKandidaatToggle={toggleKaartKandidaat} />\n      {geselecteerd.size > 0 && <div className=\"flex items-center justify-between gap-3 border-b bg-muted/10 px-4 py-3 text-sm\"><span>{geselecteerd.size} kandidaat{geselecteerd.size === 1 ? '' : 'panden'} geselecteerd</span><Button size=\"sm\" onClick={() => { setPreflight(beoordeelBagSelectie(selectiePanden, geselecteerd, context)); setWeergave('zoeken'); }}><CheckCircle2 className=\"mr-1.5 h-4 w-4\" />Controleer selectie</Button></div>}\n    </>}")
          s = s.replace('className="flex items-center gap-2 rounded-md border px-3 py-2 text-xs"', 'className="flex items-center gap-2 rounded-md border px-3 py-2 text-sm"')
          s = s.replace('<span className="text-xs font-medium">Pandstatus</span>', '<span className="text-sm font-medium">Pandstatus</span>')
          s = s.replace('<span className="text-xs font-medium">Gebruiksfunctie</span>', '<span className="text-sm font-medium">Gebruiksfunctie</span>')
          p.write_text(s)

          p = Path('src/lib/bag/handmatigePromotie.ts')
          s = p.read_text()
          s = s.replace("herkomstReferentie: `Private BAG scope ${scopeCode}; dataset ${pand.datasetversieId}; voorkomen ${pand.voorkomenSleutel}`,", "herkomstReferentie: pand.voorkomenSleutel\n      ? `Private BAG scope ${scopeCode}; dataset ${pand.datasetversieId}; voorkomen ${pand.voorkomenSleutel}`\n      : `Private BAG scope ${scopeCode}; dataset ${pand.datasetversieId}; geselecteerd via kaart`,")
          p.write_text(s)

          p = Path('src/test/bag/pandenverkennerUx1e3Contract.test.ts')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text("""import { describe, expect, it } from 'vitest';\nimport fs from 'node:fs';\n\ndescribe('Pandenverkenner UX 1E.3 contract', () => {\n  const kaart = fs.readFileSync('src/components/bag/BagPandenKaart.tsx', 'utf8');\n  const lijst = fs.readFileSync('src/components/bag/BagServicePandenlijst.tsx', 'utf8');\n  const promotie = fs.readFileSync('src/lib/bag/handmatigePromotie.ts', 'utf8');\n\n  it('maakt kaartpopup actiegericht zonder directe CRM-write', () => {\n    expect(kaart).toContain('Selecteer kandidaat');\n    expect(kaart).toContain('Google Maps');\n    expect(kaart).toContain('BAG-ID');\n    expect(kaart).not.toContain('Toevoegen aan CRM');\n  });\n\n  it('gebruikt dezelfde selectie en preflight voor kaartkandidaten', () => {\n    expect(lijst).toContain('kaartKandidaten');\n    expect(lijst).toContain('beoordeelBagSelectie(selectiePanden, geselecteerd, context)');\n    expect(lijst).toContain('onKandidaatToggle={toggleKaartKandidaat}');\n  });\n\n  it('legt kaartprovenance expliciet vast', () => {\n    expect(promotie).toContain('geselecteerd via kaart');\n  });\n});\n""")
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/bag/BagPandenKaart.tsx src/components/bag/BagServicePandenlijst.tsx src/lib/bag/handmatigePromotie.ts src/test/bag/pandenverkennerUx1e3Contract.test.ts
          git commit -m "feat(bag): maak kaartpopup actiegericht en typografie consistenter 1E.3"
          git push origin HEAD:feat/pandenverkenner-ux-1e3
