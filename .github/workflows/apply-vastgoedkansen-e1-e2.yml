name: Apply vastgoedkansen E1 E2
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply-vastgoedkansen-e1-e2.mjs
      - .github/workflows/apply-vastgoedkansen-e1-e2.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply BUILD E1 E2
        run: node scripts/apply-vastgoedkansen-e1-e2.mjs
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Remove temporary automation
        run: rm scripts/apply-vastgoedkansen-e1-e2.mjs .github/workflows/apply-vastgoedkansen-e1-e2.yml
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: voeg Vastgoedkansen kernmodel en werkbak toe"
          git push
