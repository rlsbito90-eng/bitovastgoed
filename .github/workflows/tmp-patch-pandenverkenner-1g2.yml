name: Tijdelijke Pandenverkenner 1G.2 patch

on:
  push:
    branches:
      - feat/pandenverkenner-map-v2-ux

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply Pandenverkenner 1G.2 patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pandenverkenner-map-v2-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tmp-patch-pandenverkenner-1g2.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/bag/BagPandenKaart.tsx src/components/bag/BagServicePandenlijst.tsx src/lib/bag/pandenverkennerUx1e2Contract.test.ts src/lib/bag/pandenverkennerUiContract.test.ts src/lib/bag/pandenverkennerKaart1E1.test.ts src/test/bag/pandenverkennerKaartFlowHotfix.test.ts src/test/bag/pandenverkennerWorkflowPersistence.test.ts src/test/bag/pandenverkennerKaartWorkflowFocus.test.ts src/test/bag/pandenverkennerMapV2.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(bag): apply Pandenverkenner 1G.2 patch"
          git push
