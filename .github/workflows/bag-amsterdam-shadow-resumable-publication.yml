name: BAG Amsterdam resumable publication
run-name: BAG Amsterdam publication — ${{ github.event.inputs.phase }} — artifact 8973886061

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Exact: PUBLISH_BAG_AMSTERDAM_ARTIFACT_8973886061_TO_SHADOW'
        required: true
        type: string
      phase:
        description: 'Voer exact één publicationfase uit'
        required: true
        type: choice
        options:
          - objecten
          - voorkomens
          - relaties
          - geometrieen
          - validate
      disk_cap_gib:
        description: 'Actuele provisioned BAG-shadow disk-cap in GiB'
        required: true
        default: '16'
        type: choice
        options:
          - '16'
          - '32'
          - '64'

permissions:
  contents: read

concurrency:
  group: bag-amsterdam-shadow-resumable-publication
  cancel-in-progress: false

jobs:
  publication:
    if: github.event.inputs.approval == 'PUBLISH_BAG_AMSTERDAM_ARTIFACT_8973886061_TO_SHADOW'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: bag-shadow
    env:
      BAG_SHADOW_DATABASE_URL: ${{ secrets.BAG_SHADOW_DATABASE_URL }}
      BAG_SHADOW_PROJECT_REF: xfygspvpeugxowxbcvnm
      BAG_AMSTERDAM_PUBLICATION_APPROVAL: ${{ github.event.inputs.approval }}
      BAG_AMSTERDAM_DISK_CAP_GIB: ${{ github.event.inputs.disk_cap_gib }}
      BAG_AMSTERDAM_PUBLICATION_CHUNK_SIZE: ${{ github.event.inputs.phase == 'geometrieen' && '5000' || '50000' }}

    steps:
      - uses: actions/checkout@v4

      - name: Controleer harde publication-grenzen
        shell: bash
        run: |
          set -euo pipefail
          test "$BAG_SHADOW_PROJECT_REF" = 'xfygspvpeugxowxbcvnm'
          test "$BAG_SHADOW_PROJECT_REF" != 'ljudxyrqoifhfikueric'
          test "$BAG_SHADOW_PROJECT_REF" != 'wzkhmjuasyuvzhhycnym'
          test "$BAG_AMSTERDAM_PUBLICATION_APPROVAL" = 'PUBLISH_BAG_AMSTERDAM_ARTIFACT_8973886061_TO_SHADOW'
          case "${{ github.event.inputs.phase }}" in
            objecten|voorkomens|relaties|geometrieen|validate) ;;
            *) exit 2 ;;
          esac
          case "$BAG_AMSTERDAM_DISK_CAP_GIB" in
            16|32|64) ;;
            *) exit 2 ;;
          esac
          if [ "${{ github.event.inputs.phase }}" = 'geometrieen' ]; then
            test "$BAG_AMSTERDAM_PUBLICATION_CHUNK_SIZE" = '5000'
          else
            test "$BAG_AMSTERDAM_PUBLICATION_CHUNK_SIZE" = '50000'
          fi
          test -n "$BAG_SHADOW_DATABASE_URL"
          command -v psql

      - name: Herhaal read-only publication preflight
        shell: bash
        env:
          BAG_AMSTERDAM_PUBLICATION_PREFLIGHT_APPROVAL: CHECK_BAG_AMSTERDAM_PUBLICATION_PREFLIGHT_8973886061
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          set -euo pipefail
          bash scripts/bag/run-amsterdam-shadow-publication-preflight.sh \
            bag-amsterdam-publication-preflight-resultaat

      - name: Voer exact één resumable publicationfase uit
        shell: bash
        run: |
          set -euo pipefail
          test -z "${PGOPTIONS:-}"
          bash scripts/bag/run-amsterdam-shadow-resumable-publication.sh \
            "${{ github.event.inputs.phase }}" \
            bag-amsterdam-publication-resultaat

      - name: Upload publication-bewijs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bag-amsterdam-shadow-publication-${{ github.event.inputs.phase }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            bag-amsterdam-publication-preflight-resultaat/preflight.tsv
            bag-amsterdam-publication-preflight-resultaat/capaciteit.env
            bag-amsterdam-publication-preflight-resultaat/rapport.md
            bag-amsterdam-publication-resultaat/preflight.tsv
            bag-amsterdam-publication-resultaat/progress.tsv
            bag-amsterdam-publication-resultaat/validatie.tsv
            bag-amsterdam-publication-resultaat/rapport.md
